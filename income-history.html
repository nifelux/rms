<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Income History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .history-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--rms-border); }
    .filter-tab { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); color: var(--rms-text-muted); 
      padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; 
    }
    .filter-tab.active { background: var(--rms-yellow); color: #0a0e27; border-color: var(--rms-yellow); }
    
    .income-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); 
      border-radius: 12px; padding: 16px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .income-left { display: flex; align-items: center; gap: 14px; }
    .income-icon { 
      width: 42px; height: 42px; border-radius: 12px; 
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      background: rgba(255,215,0,0.1); color: var(--rms-yellow);
    }
    .income-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .income-date { font-size: 0.75rem; color: var(--rms-text-muted); }
    .income-amt { font-weight: 800; font-size: 1.1rem; color: var(--rms-yellow); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="history-container">
    <h2 style="margin-bottom: 5px;">Income History</h2>
    <p class="text-muted" style="margin-bottom: 20px;">All funds credited to your wallet.</p>

    <div class="filter-tabs">
      <div class="filter-tab active" onclick="filterHistory('all', this)">All Income</div>
      <div class="filter-tab" onclick="filterHistory('task_earning', this)">Mystery Boxes</div>
      <div class="filter-tab" onclick="filterHistory('wealth_claim', this)">Wealth Center</div>
      <div class="filter-tab" onclick="filterHistory('wheel_win', this)">Lucky Wheel</div>
      <div class="filter-tab" onclick="filterHistory('referral', this)">Referrals</div>
    </div>

    <div id="history-list">
      <p class="text-muted" style="text-align:center; padding: 20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</p>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    let allTxns = [];

    async function loadHistory() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      const { data: txns } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', user.id)
        .in('type', ['task_earning', 'wheel_win', 'wealth_claim', 'referral', 'admin_credit'])
        .order('created_at', { ascending: false });

      allTxns = txns || [];
      renderHistory(allTxns);
    }

    function renderHistory(txns) {
      const list = document.getElementById('history-list');
      if (txns.length === 0) {
        list.innerHTML = '<p class="text-muted" style="text-align:center; padding: 20px;">No income records found.</p>';
        return;
      }

      list.innerHTML = txns.map(t => {
        const date = new Date(t.created_at).toLocaleDateString('en-NG', { month: 'short', day: 'numeric', year: 'numeric' });
        let title = t.description || t.type.replace('_', ' ').toUpperCase();
        let icon = 'fa-coins';
        if(t.type === 'task_earning') icon = 'fa-box-open';
        if(t.type === 'wealth_claim') icon = 'fa-gem';
        if(t.type === 'wheel_win') icon = 'fa-dharmachakra';
        if(t.type === 'referral') icon = 'fa-user-plus';
        if(t.type === 'admin_credit') icon = 'fa-shield-halved';

        return `
          <div class="income-card">
            <div class="income-left">
              <div class="income-icon"><i class="fa-solid ${icon}"></i></div>
              <div>
                <div class="income-title">${title}</div>
                <div class="income-date">${date} · ${t.status}</div>
              </div>
            </div>
            <div class="income-amt">+₦${Number(t.amount).toLocaleString()}</div>
          </div>
        `;
      }).join('');
    }

    window.filterHistory = (type, btn) => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      
      if (type === 'all') renderHistory(allTxns);
      else renderHistory(allTxns.filter(t => t.type === type));
    };

    loadHistory();
  </script>
</body>
</html>
