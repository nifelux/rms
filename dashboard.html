<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Dashboard</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  
  <style>
    /* Dashboard Specific Styles */
    .dashboard-container { padding: 0 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    
    .welcome-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .welcome-text h2 { margin: 0; font-size: 1.4rem; }
    .welcome-text p { margin: 4px 0 0; color: var(--rms-text-muted); font-size: 0.9rem; }
    
    .balance-card { position: relative; overflow: hidden; text-align: center; padding: 24px 20px; }
    .balance-card::before {
      content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,26,26,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .balance-label { color: var(--rms-text-muted); font-size: 0.9rem; margin-bottom: 8px; }
    .balance-amount { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
    .balance-actions { display: flex; gap: 12px; justify-content: center; }
    
    .pending-alert { 
      background: rgba(255, 215, 0, 0.1); border: 1px solid var(--rms-yellow); 
      color: var(--rms-yellow); padding: 12px 16px; border-radius: 12px; 
      font-size: 0.85rem; margin-top: 16px; display: none; align-items: center; gap: 10px;
    }
    .pending-alert i { font-size: 1.2rem; }

    .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
    .icon-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--rms-bg-card); border: 1px solid var(--rms-border);
      border-radius: 12px; padding: 16px 8px; text-decoration: none; color: var(--rms-white);
      transition: all 0.2s ease;
    }
    .icon-item:hover { transform: translateY(-2px); border-color: var(--rms-yellow); }
    .icon-item .icon { font-size: 1.5rem; margin-bottom: 8px; color: var(--rms-white); }
    .icon-item .label { font-size: 0.7rem; text-align: center; font-weight: 500; color: var(--rms-text-muted); }
    
    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
    @media (min-width: 768px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-header h3 { margin: 0; font-size: 1.1rem; }
    .section-header a { color: var(--rms-yellow); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

    .txn-list { display: flex; flex-direction: column; gap: 12px; }
    .txn-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .txn-row:last-child { border-bottom: none; padding-bottom: 0; }
    .txn-icon { 
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05); margin-right: 12px; font-size: 1rem;
    }
    .txn-icon.in { color: var(--rms-yellow); background: rgba(255,215,0,0.1); }
    .txn-icon.out { color: var(--rms-vivid-red); background: rgba(255,26,26,0.1); }
    .txn-body { flex: 1; }
    .txn-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
    .txn-date { font-size: 0.75rem; color: var(--rms-text-muted); }
    .txn-amount { font-weight: 700; font-size: 0.95rem; }
    .txn-amount.is-in { color: var(--rms-yellow); }
    .txn-amount.is-out { color: var(--rms-vivid-red); }

    .empty-state { text-align: center; padding: 20px 0; color: var(--rms-text-muted); font-size: 0.9rem; }

    /* Floating Wheel Button */
    .floating-wheel-btn {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rms-vivid-red), #c0392b);
      border: 3px solid var(--rms-yellow);
      color: white;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(255,26,26,0.4);
      z-index: 99;
      transition: all 0.3s ease;
      animation: pulse-wheel 2s infinite;
    }
    .floating-wheel-btn:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 6px 20px rgba(255,26,26,0.6);
    }
    .floating-wheel-btn .spin-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--rms-yellow);
      color: #0a0e27;
      font-size: 0.7rem;
      font-weight: 800;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--rms-bg);
    }
    @keyframes pulse-wheel {
      0%, 100% { box-shadow: 0 4px 16px rgba(255,26,26,0.4); }
      50% { box-shadow: 0 4px 24px rgba(255,26,26,0.7); }
    }
  </style>
</head>
<body class="rv-shell">

  <!-- Shared Header Component -->
  <div id="header-container"></div>

  <div class="dashboard-container">
    
    <!-- Welcome Section -->
    <div class="welcome-section">
      <div class="welcome-text">
        <h2>Hello, <span id="user-name">User</span> <span style="font-size: 1.2rem;">👋</span></h2>
        <p>Welcome back to RMS</p>
      </div>
      <a href="/messages.html" style="color: var(--rms-white); font-size: 1.4rem; text-decoration: none; position: relative;">
        <i class="fa-regular fa-bell"></i>
        <span id="notif-badge" style="position:absolute; top:-4px; right:-4px; width:8px; height:8px; background:var(--rms-vivid-red); border-radius:50%; display:none;"></span>
      </a>
    </div>

    <!-- Balance Card -->
    <div class="rms-card balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-amount">₦<span id="wallet-balance">0.00</span></div>
      <div class="balance-actions">
        <a href="/deposit.html" class="rms-btn rms-btn-yellow" style="padding: 10px 24px; font-size: 0.9rem;">
          <i class="fa-solid fa-arrow-down" style="margin-right: 6px;"></i> Deposit
        </a>
        <a href="/withdraw.html" class="rms-btn rms-btn-outline" style="padding: 10px 24px; font-size: 0.9rem;">
          <i class="fa-solid fa-arrow-up" style="margin-right: 6px;"></i> Withdraw
        </a>
      </div>
      
      <!-- Pending Withdrawal Alert -->
      <div id="pending-withdrawal-note" class="pending-alert">
        <i class="fa-solid fa-circle-info"></i>
        <span id="pending-note-text">Funds tied up in pending withdrawal.</span>
      </div>
    </div>

    <!-- Main Navigation Grid -->
    <div class="icon-grid">
      <a href="/investments.html" class="icon-item">
        <div class="icon"><i class="fa-solid fa-box-open"></i></div>
        <div class="label">Mystery Boxes</div>
      </a>
      <a href="/wealth-center.html" class="icon-item">
        <div class="icon text-yellow"><i class="fa-solid fa-gem"></i></div>
        <div class="label text-yellow">Wealth Center</div>
      </a>
      <a href="/vip.html" class="icon-item">
        <div class="icon text-red"><i class="fa-solid fa-crown"></i></div>
        <div class="label text-red">VIP Tiers</div>
      </a>
      <a href="/team.html" class="icon-item">
        <div class="icon"><i class="fa-solid fa-users"></i></div>
        <div class="label">My Team</div>
      </a>
      <a href="/deposit.html" class="icon-item">
        <div class="icon"><i class="fa-solid fa-wallet"></i></div>
        <div class="label">Deposit</div>
      </a>
      <a href="/withdraw.html" class="icon-item">
        <div class="icon"><i class="fa-solid fa-building-columns"></i></div>
        <div class="label">Withdraw</div>
      </a>
      <a href="/support.html" class="icon-item">
        <div class="icon"><i class="fa-solid fa-headset"></i></div>
        <div class="label">Support</div>
      </a>
      <a href="/settings.html" class="icon-item">
        <div class="icon"><i class="fa-solid fa-gear"></i></div>
        <div class="label">Settings</div>
      </a>
    </div>

    <!-- Dashboard Data Grid -->
    <div class="dashboard-grid">
      
      <!-- Recent Transactions -->
      <div class="rms-card">
        <div class="section-header">
          <h3>Recent Transactions</h3>
          <a href="/transaction-history.html">View all <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i></a>
        </div>
        <div id="transactions-list">
          <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
        </div>
      </div>

      <!-- Recent Tasks / Activity -->
      <div class="rms-card">
        <div class="section-header">
          <h3>Recent Activity</h3>
          <a href="/investments.html">Do a task <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i></a>
        </div>
        <div id="activity-list">
          <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Floating Lucky Wheel Button -->
  <a href="/lucky-wheel.html" class="floating-wheel-btn" id="wheel-btn" title="Lucky Wheel">
    <i class="fa-solid fa-dharmachakra"></i>
    <span class="spin-badge" id="spin-count">0</span>
  </a>

  <!-- Shared Footer/Nav Component -->
  <div id="footer-container"></div>

  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    
    // Initialize Supabase (Ensure this matches your repo's setup)
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase; // Required for shared header component

    async function loadDashboard() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { window.location.href = '/login.html'; return; }

      // 1. Fetch Profile for Name
      const { data: profile } = await supabase.from('profiles').select('full_name, username, vip_level').eq('id', user.id).single();
      document.getElementById('user-name').textContent = profile?.full_name || profile?.username || 'User';

      // 2. Fetch Wallet Balance & Pending Withdrawals
      const { data: wallet } = await supabase.from('wallets').select('balance').eq('user_id', user.id).single();
      const balance = wallet?.balance || 0;
      document.getElementById('wallet-balance').textContent = Number(balance).toLocaleString('en-NG', { minimumFractionDigits: 2 });

      const { data: pendingWithdrawals } = await supabase.from('withdrawals').select('amount').eq('user_id', user.id).eq('status', 'pending');
      const pendingTotal = (pendingWithdrawals || []).reduce((sum, w) => sum + Number(w.amount), 0);
      
      if (pendingTotal > 0) {
        const note = document.getElementById('pending-withdrawal-note');
        document.getElementById('pending-note-text').textContent = `₦${pendingTotal.toLocaleString()} is tied up in a pending withdrawal.`;
        note.style.display = 'flex';
      }

      // 3. Fetch Lucky Wheel Spins (for badge)
      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const wheelRes = await fetch('/api/wheel?action=getSpinStatus', { headers: { 'Authorization': `Bearer ${token}` } });
        if (wheelRes.ok) {
          const wheelData = await wheelRes.json();
          const spinCount = wheelData.spins_remaining || 0;
          const badge = document.getElementById('spin-count');
          badge.textContent = spinCount;
          badge.style.display = spinCount > 0 ? 'flex' : 'none';
        }
      } catch (err) {
        console.error('Wheel status error:', err);
      }

      // 4. Fetch Recent Transactions
      const { data: txns } = await supabase.from('transactions').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(5);
      const txnList = document.getElementById('transactions-list');
      
      if (txns && txns.length > 0) {
        txnList.innerHTML = txns.map(t => {
          const isIn = ['deposit', 'task_earning', 'wealth_claim', 'referral', 'wheel_win', 'admin_credit'].includes(t.type);
          const iconClass = isIn ? 'fa-arrow-down' : 'fa-arrow-up';
          const amountClass = isIn ? 'is-in' : 'is-out';
          const sign = isIn ? '+' : '-';
          const title = t.description || t.type.replace('_', ' ').toUpperCase();
          const date = new Date(t.created_at).toLocaleDateString('en-NG', { month: 'short', day: 'numeric' });
          
          return `
            <div class="txn-row">
              <div style="display: flex; align-items: center;">
                <div class="txn-icon ${isIn ? 'in' : 'out'}"><i class="fa-solid ${iconClass}"></i></div>
                <div class="txn-body">
                  <div class="txn-title">${title}</div>
                  <div class="txn-date">${date} · ${t.status}</div>
                </div>
              </div>
              <div class="txn-amount ${amountClass}">${sign}₦${Number(t.amount).toLocaleString()}</div>
            </div>
          `;
        }).join('');
      } else {
        txnList.innerHTML = '<div class="empty-state">No transactions yet.</div>';
      }

      // 5. Fetch Recent Task Activity (Mystery Boxes & Wealth)
      const { data: recentTasks } = await supabase.from('transactions').select('*').eq('user_id', user.id).in('type', ['task_earning', 'wealth_claim', 'wheel_win']).order('created_at', { ascending: false }).limit(5);
      const activityList = document.getElementById('activity-list');

      if (recentTasks && recentTasks.length > 0) {
        activityList.innerHTML = recentTasks.map(t => {
          let icon = 'fa-box-open';
          if (t.type === 'wealth_claim') icon = 'fa-gem';
          if (t.type === 'wheel_win') icon = 'fa-dharmachakra';
          const title = t.description || t.type.replace('_', ' ').toUpperCase();
          const date = new Date(t.created_at).toLocaleDateString('en-NG', { month: 'short', day: 'numeric' });
          
          return `
            <div class="txn-row">
              <div style="display: flex; align-items: center;">
                <div class="txn-icon in"><i class="fa-solid ${icon}"></i></div>
                <div class="txn-body">
                  <div class="txn-title">${title}</div>
                  <div class="txn-date">${date}</div>
                </div>
              </div>
              <div class="txn-amount is-in">+₦${Number(t.amount).toLocaleString()}</div>
            </div>
          `;
        }).join('');
      } else {
        activityList.innerHTML = '<div class="empty-state">No recent activity. Open a Mystery Box!</div>';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
