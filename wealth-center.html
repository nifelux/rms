<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Wealth Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .wealth-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: var(--rms-text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--rms-white); }
    
    .section-title { font-size: 1.1rem; font-weight: 700; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
    .plan-card { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 16px; padding: 20px; margin-bottom: 16px; position: relative; }
    .plan-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--rms-yellow); border-radius: 16px 0 0 16px; }
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .plan-name { font-weight: 700; font-size: 1.1rem; }
    .plan-duration { font-size: 0.8rem; color: var(--rms-text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }
    .plan-amounts { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .amount-block p { margin: 0; font-size: 0.75rem; color: var(--rms-text-muted); }
    .amount-block h4 { margin: 4px 0 0; font-size: 1.1rem; }
    
    .investment-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--rms-bg-card); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--rms-border); }
    .status-badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }
    .status-active { background: rgba(255,215,0,0.1); color: var(--rms-yellow); }
    .status-matured { background: rgba(46,204,113,0.1); color: #2ecc71; }
    .status-claimed { background: rgba(255,255,255,0.05); color: var(--rms-text-muted); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="wealth-container">
    <h2 style="margin-bottom: 5px;">Wealth Center</h2>
    <p class="text-muted">Lock funds, earn guaranteed returns.</p>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Invested</div>
        <div class="stat-value">₦<span id="total-invested">0</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Earnings</div>
        <div class="stat-value text-yellow">₦<span id="total-earnings">0</span></div>
      </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-briefcase text-yellow"></i> My Investments</div>
    <div id="my-investments-list">
      <p class="text-muted" style="text-align:center; padding: 20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</p>
    </div>

    <div class="section-title"><i class="fa-solid fa-store text-yellow"></i> Available Plans</div>
    <div id="plans-list">
      <p class="text-muted" style="text-align:center; padding: 20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</p>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadWealthCenter() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';
      const token = (await supabase.auth.getSession()).data.session.access_token;

      // Fetch Plans
      const plansRes = await fetch('/api/wealth?action=getPlans', { headers: { 'Authorization': `Bearer ${token}` } });
      const { plans } = await plansRes.json();
      
      const plansList = document.getElementById('plans-list');
      plansList.innerHTML = plans.map(p => `
        <div class="plan-card">
          <div class="plan-header">
            <div class="plan-name">${p.name}</div>
            <div class="plan-duration"><i class="fa-regular fa-clock"></i> ${p.duration_days} Days</div>
          </div>
          <div class="plan-amounts">
            <div class="amount-block"><p>Invest</p><h4>₦${Number(p.invest_amount).toLocaleString()}</h4></div>
            <div class="amount-block" style="text-align:right;"><p>Receive</p><h4 class="text-yellow">₦${Number(p.return_amount).toLocaleString()}</h4></div>
          </div>
          <button class="rms-btn rms-btn-yellow" style="width:100%;" onclick="investInPlan('${p.id}', ${p.invest_amount})">Invest Now</button>
        </div>
      `).join('');

      // Fetch My Investments
      const { data: investments } = await supabase.from('wealth_investments').select('*, wealth_plans(name)').eq('user_id', user.id).order('created_at', { ascending: false });
      const invList = document.getElementById('my-investments-list');
      
      if (investments && investments.length > 0) {
        let totalInv = 0, totalEarn = 0;
        invList.innerHTML = investments.map(inv => {
          totalInv += Number(inv.invest_amount);
          if(inv.status === 'matured') totalEarn += (Number(inv.return_amount) - Number(inv.invest_amount));
          
          let btn = '';
          if (inv.status === 'matured') btn = `<button class="rms-btn rms-btn-primary" style="padding: 6px 16px; font-size: 0.8rem;" onclick="claimInvestment('${inv.id}')"><i class="fa-solid fa-hand-holding-dollar"></i> Claim</button>`;
          
          return `
            <div class="investment-row">
              <div>
                <div style="font-weight:700; font-size:0.95rem;">${inv.wealth_plans?.name || 'Plan'}</div>
                <div style="font-size:0.75rem; color:var(--rms-text-muted);">Mat: ${new Date(inv.maturity_date).toLocaleDateString()}</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="status-badge status-${inv.status}">${inv.status}</span>
                ${btn}
              </div>
            </div>
          `;
        }).join('');
        document.getElementById('total-invested').textContent = totalInv.toLocaleString();
        document.getElementById('total-earnings').textContent = totalEarn.toLocaleString();
      } else {
        invList.innerHTML = '<p class="text-muted" style="text-align:center; padding: 20px;">No active investments.</p>';
      }
    }

    window.investInPlan = async (planId, amount) => {
      if(!confirm(`Invest ₦${amount.toLocaleString()} in this plan?`)) return;
      const token = (await supabase.auth.getSession()).data.session.access_token;
      const res = await fetch('/api/wealth?action=invest', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ plan_id: planId })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if(res.ok) loadWealthCenter();
    };

    window.claimInvestment = async (invId) => {
      if(!confirm('Claim your matured investment?')) return;
      const token = (await supabase.auth.getSession()).data.session.access_token;
      const res = await fetch('/api/wealth?action=claim', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ investment_id: invId })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if(res.ok) loadWealthCenter();
    };

    loadWealthCenter();
  </script>
</body>
</html>
