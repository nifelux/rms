<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Wealth Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .wealth-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: var(--rms-text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--rms-white); }
    .stat-value.yellow { color: var(--rms-yellow); }

    .section-title { font-size: 1.1rem; font-weight: 700; margin: 24px 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .section-title i { color: var(--rms-yellow); }

    .plan-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 16px; 
      padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden; 
    }
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .plan-name { font-size: 1.2rem; font-weight: 800; color: var(--rms-white); }
    .plan-price { font-size: 1.1rem; font-weight: 700; color: var(--rms-yellow); }
    
    .plan-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .plan-detail { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; text-align: center; }
    .plan-detail-val { font-size: 1rem; font-weight: 700; color: var(--rms-white); margin-bottom: 4px; }
    .plan-detail-lbl { font-size: 0.7rem; color: var(--rms-text-muted); text-transform: uppercase; }

    .invest-btn { 
      width: 100%; padding: 12px; font-size: 1rem; font-weight: 700; border: none; border-radius: 10px; 
      background: linear-gradient(135deg, var(--rms-yellow), #e6c200); color: #0a0e27; cursor: pointer; 
      transition: all 0.2s;
    }
    .invest-btn:hover:not(:disabled) { transform: scale(1.02); }
    .invest-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #555; color: #aaa; }

    .investment-item { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; 
      padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; 
    }
    .inv-info h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--rms-white); }
    .inv-info p { margin: 0; font-size: 0.75rem; color: var(--rms-text-muted); }
    .inv-amount { font-weight: 800; color: var(--rms-yellow); font-size: 1rem; }
    .inv-status { font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; font-weight: 700; margin-top: 4px; display: inline-block; }
    .status-active { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .status-completed { background: rgba(52,152,219,0.15); color: #3498db; }

    .empty-state { text-align: center; padding: 30px 20px; color: var(--rms-text-muted); font-size: 0.9rem; }
    .loading-box { text-align: center; padding: 30px; color: var(--rms-text-muted); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="wealth-container">
    <h2 style="margin-bottom: 5px;">Wealth Center</h2>
    <p class="text-muted" style="margin-bottom: 24px;">Lock funds, earn guaranteed returns.</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Invested</div>
        <div class="stat-value">₦<span id="total-invested">0</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Earnings</div>
        <div class="stat-value yellow">₦<span id="total-earnings">0</span></div>
      </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-briefcase"></i> My Investments</div>
    <div id="investments-list">
      <div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
    </div>

    <div class="section-title"><i class="fa-solid fa-store"></i> Available Plans</div>
    <div id="plans-list">
      <div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadWealthPage() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return window.location.href = '/login.html';

        // 1. Load Stats & Investments
        const { data: investments } = await supabase
          .from('investments')
          .select('*')
          .eq('user_id', session.user.id)
          .order('created_at', { ascending: false });

        let totalInvested = 0;
        let totalEarnings = 0;
        const invList = document.getElementById('investments-list');

        if (investments && investments.length > 0) {
          investments.forEach(inv => {
            totalInvested += Number(inv.amount);
            if (inv.status === 'completed') totalEarnings += Number(inv.return_amount || 0);
          });

          invList.innerHTML = investments.map(inv => `
            <div class="investment-item">
              <div class="inv-info">
                <h4>${inv.plan_name || 'Wealth Plan'}</h4>
                <p>Started: ${new Date(inv.created_at).toLocaleDateString()}</p>
                <span class="inv-status status-${inv.status}">${inv.status.toUpperCase()}</span>
              </div>
              <div style="text-align: right;">
                <div class="inv-amount">₦${Number(inv.amount).toLocaleString()}</div>
              </div>
            </div>
          `).join('');
        } else {
          invList.innerHTML = '<div class="empty-state">No active investments yet.</div>';
        }

        document.getElementById('total-invested').textContent = totalInvested.toLocaleString();
        document.getElementById('total-earnings').textContent = totalEarnings.toLocaleString();

        // 2. Load Available Plans
        const { data: plans } = await supabase
          .from('wealth_plans')
          .select('*')
          .eq('is_active', true)
          .order('invest_amount', { ascending: true });

        const { data: wallet } = await supabase.from('wallets').select('balance').eq('user_id', session.user.id).single();
        const balance = wallet?.balance || 0;

        const plansList = document.getElementById('plans-list');
        if (plans && plans.length > 0) {
          plansList.innerHTML = plans.map(plan => {
            const canAfford = Number(balance) >= Number(plan.invest_amount);
            return `
              <div class="plan-card">
                <div class="plan-header">
                  <div class="plan-name">${plan.name}</div>
                  <div class="plan-price">₦${Number(plan.invest_amount).toLocaleString()}</div>
                </div>
                <div class="plan-details">
                  <div class="plan-detail">
                    <div class="plan-detail-val yellow">₦${Number(plan.return_amount).toLocaleString()}</div>
                    <div class="plan-detail-lbl">Total Return</div>
                  </div>
                  <div class="plan-detail">
                    <div class="plan-detail-val">${plan.duration_days} Days</div>
                    <div class="plan-detail-lbl">Duration</div>
                  </div>
                </div>
                <button class="invest-btn" onclick="investInPlan('${plan.id}', '${plan.name}', ${plan.invest_amount})" ${!canAfford ? 'disabled' : ''}>
                  ${canAfford ? '<i class="fa-solid fa-bolt"></i> Invest Now' : '<i class="fa-solid fa-lock"></i> Insufficient Balance'}
                </button>
              </div>
            `;
          }).join('');
        } else {
          plansList.innerHTML = '<div class="empty-state">No wealth plans available at the moment.</div>';
        }

      } catch (err) {
        console.error('Wealth page error:', err);
        showToast('Failed to load wealth data', 'error');
      }
    }

    window.investInPlan = async (planId, planName, amount) => {
      showConfirm(`Invest ₦${Number(amount).toLocaleString()} in ${planName}? This amount will be deducted from your balance.`, async () => {
        try {
          const token = (await supabase.auth.getSession()).data.session.access_token;
          const res = await fetch('/api/wealth?action=invest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ plan_id: planId, amount: amount })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Investment failed');

          showToast(`Successfully invested in ${planName}!`, 'success');
          setTimeout(() => loadWealthPage(), 1500);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    };

    loadWealthPage();
  </script>
</body>
</html>
