<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Wealth Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .wealth-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; font-family: 'Inter', sans-serif; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; text-align: center; backdrop-filter: blur(10px); }
    .stat-label { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
    .stat-value { font-size: 1.6rem; font-weight: 900; color: white; }
    .stat-value.yellow { color: #ffd700; }

    .section-title { font-size: 1.2rem; font-weight: 800; margin: 28px 0 16px 0; display: flex; align-items: center; gap: 10px; color: white; }
    .section-title i { color: #00d4ff; }

    .plan-card { 
      background: linear-gradient(135deg, rgba(0,102,255,0.1), rgba(0,212,255,0.05));
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 20px; 
      padding: 24px; 
      margin-bottom: 16px; 
      position: relative; 
      overflow: hidden;
      transition: all 0.3s;
    }
    .plan-card:hover { border-color: #ffd700; transform: translateY(-2px); }
    .plan-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #0066ff, #00d4ff, #0066ff);
    }
    .plan-card.unavailable {
      opacity: 0.6;
      border-color: rgba(255,255,255,0.1);
    }
    .plan-card.unavailable::before {
      background: linear-gradient(90deg, #666, #999, #666);
    }
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .plan-name { font-size: 1.3rem; font-weight: 800; color: white; }
    .plan-price { font-size: 1.2rem; font-weight: 900; color: #ffd700; }
    
    .plan-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .plan-detail { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; text-align: center; }
    .plan-detail-val { font-size: 1.1rem; font-weight: 800; color: white; margin-bottom: 4px; }
    .plan-detail-lbl { font-size: 0.7rem; color: rgba(255,255,255,0.6); text-transform: uppercase; font-weight: 600; }

    .plan-availability {
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #00d4ff;
      text-align: center;
      font-weight: 600;
    }
    .plan-availability.expired {
      background: rgba(255,68,68,0.1);
      border-color: rgba(255,68,68,0.3);
      color: #ff4444;
    }
    .plan-availability.upcoming {
      background: rgba(255,165,0,0.1);
      border-color: rgba(255,165,0,0.3);
      color: #ffa500;
    }

    .invest-btn { 
      width: 100%; 
      padding: 14px; 
      font-size: 1rem; 
      font-weight: 800; 
      border: none; 
      border-radius: 12px; 
      background: linear-gradient(135deg, #ffd700, #e6c200); 
      color: #0a0e27; 
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(255,215,0,0.3);
    }
    .invest-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,215,0,0.4); }
    .invest-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #555; color: #aaa; box-shadow: none; }

    .investment-item { 
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; 
      padding: 18px; 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .investment-item:hover { border-color: rgba(255,215,0,0.3); }
    .inv-info h4 { margin: 0 0 8px 0; font-size: 1.05rem; color: white; font-weight: 700; }
    .inv-info p { margin: 0 0 10px 0; font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    .inv-amount { font-weight: 900; color: #ffd700; font-size: 1.1rem; }
    .inv-return { font-size: 0.8rem; color: #00ff88; margin-top: 6px; font-weight: 600; }
    
    .inv-status { font-size: 0.7rem; padding: 5px 12px; border-radius: 10px; font-weight: 700; margin-top: 8px; display: inline-block; }
    .status-active { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
    .status-completed { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }

    .claim-btn {
      background: linear-gradient(135deg, #00d26a, #00ff88);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      animation: pulse 2s infinite;
      box-shadow: 0 6px 20px rgba(0,255,136,0.3);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,255,136,0.7); }
      70% { box-shadow: 0 0 0 8px rgba(0,255,136,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,255,136,0); }
    }

    .empty-state { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.5); font-size: 0.95rem; }
    .loading-box { text-align: center; padding: 40px; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="wealth-container">
    <h2 style="margin-bottom: 5px; font-size: 1.8rem; font-weight: 900; color: white;">Wealth Center</h2>
    <p style="color: rgba(255,255,255,0.6); margin-bottom: 24px; font-size: 0.95rem;">Lock funds, earn guaranteed returns.</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Invested</div>
        <div class="stat-value">₦<span id="total-invested">0</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Earnings</div>
        <div class="stat-value yellow">₦<span id="total-earnings">0</span></div>
      </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-briefcase"></i> My Investments</div>
    <div id="investments-list">
      <div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
    </div>

    <div class="section-title"><i class="fa-solid fa-store"></i> Available Plans</div>
    <div id="plans-list">
      <div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    function checkPlanAvailability(plan) {
      const now = new Date();
      const startDate = plan.start_date ? new Date(plan.start_date) : null;
      const endDate = plan.end_date ? new Date(plan.end_date + 'T23:59:59') : null;
      
      if (!startDate && !endDate) return { available: true, message: 'Always Available' };
      if (startDate && now < startDate) return { available: false, message: `Starts: ${startDate.toLocaleDateString()}`, type: 'upcoming' };
      if (endDate && now > endDate) return { available: false, message: `Ended: ${endDate.toLocaleDateString()}`, type: 'expired' };
      
      let message = 'Available Now';
      if (startDate && endDate) message = `Available: ${startDate.toLocaleDateString()} - ${endDate.toLocaleDateString()}`;
      else if (endDate) message = `Available until: ${endDate.toLocaleDateString()}`;
      else if (startDate) message = `Started: ${startDate.toLocaleDateString()}`;
      
      return { available: true, message };
    }

    async function loadWealthPage() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return window.location.href = '/login.html';

        const { data: profile } = await supabase
          .from('profiles')
          .select('vip_level')
          .eq('id', session.user.id)
          .single();

        if (!profile || profile.vip_level === 'newbie' || profile.vip_level === 'M0') {
          document.body.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0e27,#1a1f4e);color:white;padding:20px;">
              <div style="max-width:400px;text-align:center;">
                <div style="font-size:5rem;margin-bottom:20px;">🔒</div>
                <h2 style="margin-bottom:16px;font-size:1.8rem;font-weight:900;">VIP Access Required</h2>
                <p style="color:rgba(255,255,255,0.7);margin-bottom:24px;font-size:1rem;line-height:1.6;">
                  Wealth Center is only available for <strong style="color:#ffd700;">M1 and above</strong>. 
                  Upgrade now to access exclusive investment plans and earn passive income!
                </p>
                <a href="/vip.html" style="display:inline-block;padding:16px 36px;background:linear-gradient(135deg,#ffd700,#e6c200);color:#0a0e27;text-decoration:none;border-radius:14px;font-weight:800;font-size:1.05rem;box-shadow:0 8px 24px rgba(255,215,0,0.4);">
                  <i class="fa-solid fa-crown"></i> Upgrade to M1
                </a>
                <br><br>
                <a href="/dashboard.html" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:0.9rem;">← Back to Dashboard</a>
              </div>
            </div>
          `;
          return;
        }

        // 1. Load Investments
        const { data: investments } = await supabase
          .from('wealth_investments')
          .select('*')
          .eq('user_id', session.user.id)
          .order('created_at', { ascending: false });

        let totalInvested = 0;
        let totalEarnings = 0;
        const invList = document.getElementById('investments-list');

        if (investments && investments.length > 0) {
          investments.forEach(inv => {
            totalInvested += Number(inv.amount);
            if (inv.status === 'completed') totalEarnings += Number(inv.return_amount);
          });

          invList.innerHTML = investments.map(inv => {
            const startDate = new Date(inv.created_at);
            const maturityDate = new Date(startDate);
            const durationMs = inv.duration_days * 24 * 60 * 60 * 1000;
            maturityDate.setTime(startDate.getTime() + durationMs);
            
            const now = new Date();
            const isMatured = now >= maturityDate && inv.status === 'active';
            const isCompleted = inv.status === 'completed';
            const durationText = `${inv.duration_days} Days`;

            let actionHtml = '';
            if (isCompleted) {
              actionHtml = `<span class="inv-status status-completed"><i class="fa-solid fa-check"></i> COMPLETED</span>`;
            } else if (isMatured) {
              actionHtml = `<button class="claim-btn" onclick="claimInvestment('${inv.id}')"><i class="fa-solid fa-gift"></i> Claim ₦${Number(inv.return_amount).toLocaleString()}</button>`;
            } else {
              actionHtml = `<span class="inv-status status-active"><i class="fa-solid fa-clock"></i> Active (${durationText})</span>`;
            }

            return `
              <div class="investment-item">
                <div class="inv-info" style="flex: 1;">
                  <h4>${inv.plan_name}</h4>
                  <p>Invested: ${new Date(inv.created_at).toLocaleDateString()}</p>
                  ${actionHtml}
                </div>
                <div style="text-align: right; margin-left: 12px;">
                  <div class="inv-amount">₦${Number(inv.amount).toLocaleString()}</div>
                  <div class="inv-return">Return: ₦${Number(inv.return_amount).toLocaleString()}</div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          invList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-folder-open" style="font-size: 2.5rem; margin-bottom: 12px; opacity: 0.3;"></i><p>No active investments yet.</p></div>';
        }

        document.getElementById('total-invested').textContent = totalInvested.toLocaleString();
        document.getElementById('total-earnings').textContent = totalEarnings.toLocaleString();

        // 2. Load Packages from wealth_packages table
        const { data: packages } = await supabase
          .from('wealth_packages')
          .select('*')
          .eq('is_active', true)
          .order('investment_amount', { ascending: true });
          
        const { data: wallet } = await supabase
          .from('wallets')
          .select('balance')
          .eq('user_id', session.user.id)
          .single();
        const balance = wallet?.balance || 0;

        const plansList = document.getElementById('plans-list');
        if (packages && packages.length > 0) {
          plansList.innerHTML = packages.map(pkg => {
            const canAfford = Number(balance) >= Number(pkg.investment_amount);
            const availability = checkPlanAvailability(pkg);
            const durationText = `${pkg.duration_days} Days`;
            const totalReturn = pkg.total_return || (pkg.daily_return * pkg.duration_days);
            
            return `
              <div class="plan-card ${!availability.available ? 'unavailable' : ''}">
                <div class="plan-header">
                  <div class="plan-name">${pkg.name}</div>
                  <div class="plan-price">₦${Number(pkg.investment_amount).toLocaleString()}</div>
                </div>
                ${availability.message ? `
                  <div class="plan-availability ${availability.type || ''}">
                    <i class="fa-solid fa-${availability.available ? 'check-circle' : availability.type === 'expired' ? 'times-circle' : 'clock'}"></i>
                    ${availability.message}
                  </div>
                ` : ''}
                <div class="plan-details">
                  <div class="plan-detail">
                    <div class="plan-detail-val" style="color:#ffd700;">₦${Number(totalReturn).toLocaleString()}</div>
                    <div class="plan-detail-lbl">Total Return</div>
                  </div>
                  <div class="plan-detail">
                    <div class="plan-detail-val">${durationText}</div>
                    <div class="plan-detail-lbl">Duration</div>
                  </div>
                  <div class="plan-detail">
                    <div class="plan-detail-val" style="color:#00ff88;">₦${Number(pkg.daily_return).toLocaleString()}</div>
                    <div class="plan-detail-lbl">Daily Return</div>
                  </div>
                  <div class="plan-detail">
                    <div class="plan-detail-val">${((totalReturn / pkg.investment_amount - 1) * 100).toFixed(1)}%</div>
                    <div class="plan-detail-lbl">ROI</div>
                  </div>
                </div>
                <button class="invest-btn" onclick="investInPlan('${pkg.id}', '${pkg.name}', ${pkg.investment_amount}, ${pkg.daily_return}, ${pkg.duration_days}, ${totalReturn})" ${!canAfford || !availability.available ? 'disabled' : ''}>
                  ${!availability.available ? '<i class="fa-solid fa-clock"></i> ' + (availability.type === 'upcoming' ? 'Coming Soon' : 'Expired') : 
                    canAfford ? '<i class="fa-solid fa-bolt"></i> Invest Now' : '<i class="fa-solid fa-lock"></i> Insufficient Balance'}
                </button>
              </div>
            `;
          }).join('');
        } else {
          plansList.innerHTML = '<div class="empty-state">No wealth plans available.</div>';
        }

      } catch (err) {
        console.error('Wealth page error:', err);
        showToast('Failed to load wealth data', 'error');
      }
    }

    window.investInPlan = async (packageId, packageName, amount, dailyReturn, durationDays, totalReturn) => {
      showConfirm(`Invest ₦${Number(amount).toLocaleString()} in ${packageName}? You'll earn ₦${Number(dailyReturn).toLocaleString()} daily for ${durationDays} days.`, async () => {
        try {
          const token = (await supabase.auth.getSession()).data.session.access_token;
          const res = await fetch('/api/wealth?action=invest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ 
              package_id: packageId, 
              amount: amount,
              plan_name: packageName,
              daily_return: dailyReturn,
              duration_days: durationDays,
              return_amount: totalReturn
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Investment failed');
          showToast(`Successfully invested in ${packageName}!`, 'success');
          setTimeout(() => loadWealthPage(), 1500);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    };

    window.claimInvestment = async (investmentId) => {
      showConfirm('Claim your investment returns now?', async () => {
        try {
          const token = (await supabase.auth.getSession()).data.session.access_token;
          const res = await fetch('/api/wealth?action=claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ investment_id: investmentId })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Claim failed');
          showToast(`🎉 Claimed! New balance: ₦${Number(data.newBalance).toLocaleString()}`, 'success');
          setTimeout(() => loadWealthPage(), 1500);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    };

    loadWealthPage();
  </script>
</body>
</html>
