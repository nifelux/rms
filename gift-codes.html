<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Gift Codes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .gift-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; text-align: center; }
    .gift-icon-large { font-size: 4rem; color: var(--rms-yellow); margin-bottom: 20px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 14px; background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 10px; color: white; font-size: 1rem; box-sizing: border-box; text-transform: uppercase; letter-spacing: 1px; }
    .form-control:focus { outline: none; border-color: var(--rms-yellow); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="gift-container">
    <div class="gift-icon-large"><i class="fa-solid fa-gift"></i></div>
    <h2 style="margin-bottom: 10px;">Redeem Gift Code</h2>
    <p class="text-muted" style="margin-bottom: 30px;">Enter your code below to claim your reward.</p>

    <form id="gift-form">
      <div class="input-group">
        <label>Gift Code</label>
        <input type="text" id="gift-code" class="form-control" placeholder="XXXX-XXXX" required>
      </div>
      <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 16px;">
        <i class="fa-solid fa-check" style="margin-right: 8px;"></i> Redeem Code
      </button>
    </form>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    document.getElementById('gift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Checking...';
      btn.disabled = true;

      const code = document.getElementById('gift-code').value.trim();
      const { data: { user } } = await supabase.auth.getUser();
      
      // Note: This calls the Postgres function we created in the SQL script.
      const { data, error } = await supabase.rpc('redeem_gift_code', { p_code: code, p_user_id: user.id });

      if (error || !data.success) {
        alert(data?.message || 'Invalid or expired code.');
      } else {
        alert(`Success! ₦${Number(data.amount).toLocaleString()} has been added to your wallet.`);
        document.getElementById('gift-code').value = '';
      }
      
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Redeem Code';
      btn.disabled = false;
    });
  </script>
</body>
</html>
