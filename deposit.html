<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Deposit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .deposit-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .bank-card { background: linear-gradient(135deg, #11163a, #1a2050); border: 1px solid var(--rms-yellow); border-radius: 16px; padding: 20px; margin-bottom: 24px; position: relative; }
    .bank-label { font-size: 0.8rem; color: var(--rms-text-muted); margin-bottom: 4px; }
    .bank-value { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .copy-btn { background: rgba(255,215,0,0.1); color: var(--rms-yellow); border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    
    .steps { margin-bottom: 24px; }
    .step { display: flex; gap: 12px; margin-bottom: 16px; }
    .step-num { width: 28px; height: 28px; background: var(--rms-vivid-red); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
    .step-text { font-size: 0.9rem; color: var(--rms-text-muted); margin-top: 4px; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="deposit-container">
    <h2 style="margin-bottom: 5px;">Fund Your Wallet</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Deposit to upgrade your M-Tier.</p>

    <div class="bank-card">
      <div class="bank-label">Bank Name</div>
      <div class="bank-value">Opay / Moniepoint <button class="copy-btn" onclick="copyText('Opay')"><i class="fa-regular fa-copy"></i></button></div>
      
      <div class="bank-label">Account Number</div>
      <div class="bank-value">8012345678 <button class="copy-btn" onclick="copyText('8012345678')"><i class="fa-regular fa-copy"></i></button></div>
      
      <div class="bank-label">Account Name</div>
      <div class="bank-value">RMS Global Ltd <button class="copy-btn" onclick="copyText('RMS Global Ltd')"><i class="fa-regular fa-copy"></i></button></div>
    </div>

    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-text">Transfer your desired amount to the account above.</div></div>
      <div class="step"><div class="step-num">2</div><div class="step-text">Copy the transaction reference/hash from your bank app.</div></div>
      <div class="step"><div class="step-num">3</div><div class="step-text">Paste it below and submit for admin approval.</div></div>
    </div>

    <form id="deposit-form">
      <div class="input-group" style="margin-bottom: 16px;">
        <label style="display:block; font-size:0.85rem; color:var(--rms-text-muted); margin-bottom:8px;">Amount (₦)</label>
        <input type="number" id="amount" class="form-control" placeholder="e.g. 3000 for M1" required style="width:100%; padding:14px; background:var(--rms-bg-card); border:1px solid var(--rms-border); border-radius:10px; color:white; box-sizing:border-box;">
      </div>
      <div class="input-group" style="margin-bottom: 20px;">
        <label style="display:block; font-size:0.85rem; color:var(--rms-text-muted); margin-bottom:8px;">Transaction Reference / Hash</label>
        <input type="text" id="reference" class="form-control" placeholder="Paste reference here" required style="width:100%; padding:14px; background:var(--rms-bg-card); border:1px solid var(--rms-border); border-radius:10px; color:white; box-sizing:border-box;">
      </div>
      <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 16px;">
        <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Submit Deposit
      </button>
    </form>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    window.copyText = (text) => { navigator.clipboard.writeText(text); alert('Copied: ' + text); };

    document.getElementById('deposit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...';
      btn.disabled = true;

      const token = (await supabase.auth.getSession()).data.session.access_token;
      const res = await fetch('/api/finance?action=createDeposit', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ amount: document.getElementById('amount').value, payment_method: 'bank_transfer', proof_image_url: document.getElementById('reference').value })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if(res.ok) window.location.href = '/dashboard.html';
      else { btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Deposit'; btn.disabled = false; }
    });
  </script>
</body>
</html>
