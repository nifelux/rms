<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Deposit Funds</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0a0e27">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%);
      min-height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .deposit-card {
      background: linear-gradient(135deg, rgba(17,22,58,0.9), rgba(26,32,80,0.9));
      border: 1px solid rgba(255,215,0,0.15);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 450px;
      width: 100%;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .deposit-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .header-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #ffd700, #e6c200);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2rem;
      color: #0a0e27;
      box-shadow: 0 8px 24px rgba(255,215,0,0.3);
    }

    .header h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: white;
      margin-bottom: 8px;
    }

    .header p {
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 18px 18px 18px 50px;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      transition: all 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: #ffd700;
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 4px rgba(255,215,0,0.1);
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    .form-control:focus ~ .input-icon {
      color: #ffd700;
    }

    .amount-hint {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 900;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffd700, #e6c200);
      color: #0a0e27;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(255,215,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255,215,0,0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #555;
      color: #aaa;
      box-shadow: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.3s;
      position: relative;
      z-index: 1;
    }

    .back-link:hover {
      color: #ffd700;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 12px;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 10px;
      font-size: 0.8rem;
      color: #00ff88;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .quick-amount-btn {
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .quick-amount-btn:hover {
      background: rgba(255,215,0,0.1);
      border-color: rgba(255,215,0,0.3);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .deposit-card { padding: 32px 24px; }
      .header h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="deposit-card">
    <div class="header">
      <div class="header-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <h2>Fund Your Wallet</h2>
      <p>Secure instant deposit via Target Growth</p>
    </div>

    <form id="deposit-form">
      <div class="form-group">
        <label>Amount (₦)</label>
        <div class="input-wrapper">
          <input 
            type="number" 
            id="amount" 
            class="form-control" 
            placeholder="Enter amount" 
            min="100" 
            max="1000000" 
            step="100"
            required 
            autocomplete="off"
          >
          <i class="fa-solid fa-naira-sign input-icon"></i>
        </div>
        <div class="amount-hint">
          <span>Min: ₦100</span>
          <span>Max: ₦1,000,000</span>
        </div>
      </div>

      <div class="quick-amounts">
        <button type="button" class="quick-amount-btn" onclick="setAmount(1000)">1,000</button>
        <button type="button" class="quick-amount-btn" onclick="setAmount(5000)">₦5,000</button>
        <button type="button" class="quick-amount-btn" onclick="setAmount(10000)">₦10,000</button>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        <i class="fa-solid fa-bolt"></i> Pay Now
      </button>
    </form>

    <div class="secure-badge">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Secured by Target Growth</span>
    </div>

    <a href="/dashboard.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');

    // Quick amount selector
    window.setAmount = (amount) => {
      document.getElementById('amount').value = amount;
      document.getElementById('amount').focus();
    };

    document.getElementById('deposit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const amountInput = document.getElementById('amount');
      const amount = amountInput.value;
      const btn = document.getElementById('submit-btn');
      
      // Validation
      const numAmount = Number(amount);
      if (!numAmount || numAmount < 100) {
        showToast('Minimum deposit is ₦100', 'error');
        amountInput.focus();
        return;
      }

      if (numAmount > 1000000) {
        showToast('Maximum deposit is ₦1,000,000', 'error');
        amountInput.focus();
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';

      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          showToast('Please login to continue', 'error');
          setTimeout(() => { window.location.href = '/login.html'; }, 1500);
          return;
        }

        const { data: profile } = await supabase
          .from('profiles')
          .select('full_name, email')
          .eq('id', user.id)
          .single();

        const token = (await supabase.auth.getSession()).data.session.access_token;
        
        console.log('🚀 Initiating Target Growth deposit...');

        const res = await fetch('/api/finance?action=initiateTargetGrowthDeposit', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({
            amount: numAmount,
            email: profile?.email || 'user@example.com',
            full_name: profile?.full_name || 'RMS User'
          })
        });

        // Check content type
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          const text = await res.text();
          console.error("API returned non-JSON:", text);
          throw new Error("Server error. Please try again.");
        }

        const data = await res.json();
        console.log('📦 API Response:', data);

        if (!res.ok) {
          throw new Error(data.error || 'Failed to initiate payment');
        }

        if (!data.checkout_url) {
          throw new Error('No checkout URL received');
        }

        showToast('Redirecting to payment...', 'success');
        
        // Small delay to show the success message
        setTimeout(() => {
          window.location.href = data.checkout_url;
        }, 1000);

      } catch (err) {
        console.error('❌ Deposit Error:', err);
        showToast(err.message || 'Payment initiation failed', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Pay Now';
      }
    });
  </script>
</body>
</html>
