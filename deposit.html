<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Deposit Funds</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0a0e27">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%); min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .deposit-card { background: linear-gradient(135deg, rgba(17,22,58,0.8), rgba(26,32,80,0.8)); border: 1px solid rgba(255,215,0,0.15); border-radius: 24px; padding: 32px 28px; max-width: 420px; width: 100%; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .header { text-align: center; margin-bottom: 28px; }
    .header h2 { font-size: 1.6rem; font-weight: 800; color: white; margin-bottom: 8px; }
    .header p { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: rgba(255,255,255,0.8); margin-bottom: 8px; font-weight: 600; }
    .input-wrapper { position: relative; }
    .form-control { width: 100%; padding: 16px 16px 16px 44px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 1.1rem; font-weight: 700; transition: all 0.3s; }
    .form-control:focus { outline: none; border-color: #ffd700; background: rgba(0,0,0,0.4); box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 1.1rem; }
    .submit-btn { width: 100%; padding: 16px; font-size: 1.05rem; font-weight: 800; border: none; border-radius: 14px; background: linear-gradient(135deg, #ffd700, #e6c200); color: #0a0e27; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 24px rgba(255,215,0,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,215,0,0.4); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; background: #555; color: #aaa; box-shadow: none; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .back-link:hover { color: #ffd700; }
  </style>
</head>
<body>
  <div class="deposit-card">
    <div class="header">
      <h2>Fund Your Wallet</h2>
      <p>Secure instant deposit via Target Growth</p>
    </div>

    <form id="deposit-form">
      <div class="form-group">
        <label>Amount (₦)</label>
        <div class="input-wrapper">
          <input type="number" id="amount" class="form-control" placeholder="e.g. 5000" min="100" required>
          <i class="fa-solid fa-naira-sign input-icon"></i>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        <i class="fa-solid fa-bolt"></i> Pay Now
      </button>
    </form>

    <a href="/dashboard.html" class="back-link">← Back to Dashboard</a>
  </div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA);

    document.getElementById('deposit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const amount = document.getElementById('amount').value;
      const btn = document.getElementById('submit-btn');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Initiating...';

      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('Please login first');

        const { data: profile } = await supabase.from('profiles').select('full_name, email').eq('id', user.id).single();

        const token = (await supabase.auth.getSession()).data.session.access_token;
        
        const res = await fetch('/api/finance?action=initiateTargetGrowthDeposit', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({
            amount: amount,
            email: profile.email,
            full_name: profile.full_name
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // Redirect to Target Growth Checkout
        window.location.href = data.checkout_url;

      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Pay Now';
      }
    });
  </script>
</body>
</html>
