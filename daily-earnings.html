<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Daily Earnings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .earnings-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .total-card { 
      background: linear-gradient(135deg, var(--rms-bg-card), #1a2050); 
      border: 1px solid var(--rms-yellow); border-radius: 16px; 
      padding: 24px; text-align: center; margin-bottom: 24px;
    }
    .total-label { font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; }
    .total-amount { font-size: 2.5rem; font-weight: 800; color: var(--rms-yellow); margin: 0; }
    
    .source-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .source-box { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; }
    .source-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .icon-box { background: rgba(255,215,0,0.1); color: var(--rms-yellow); }
    .icon-wheel { background: rgba(255,26,26,0.1); color: var(--rms-vivid-red); }
    .icon-wealth { background: rgba(46,204,113,0.1); color: #2ecc71; }
    .icon-ref { background: rgba(52,152,219,0.1); color: #3498db; }
    .source-info { flex: 1; }
    .source-name { font-size: 0.75rem; color: var(--rms-text-muted); margin-bottom: 2px; }
    .source-val { font-size: 1.1rem; font-weight: 700; color: var(--rms-white); }

    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-header h3 { margin: 0; font-size: 1.1rem; }
    .txn-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .txn-left { display: flex; align-items: center; gap: 12px; }
    .txn-icon-sm { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--rms-yellow); font-size: 0.9rem; }
    .txn-title { font-weight: 600; font-size: 0.9rem; }
    .txn-time { font-size: 0.7rem; color: var(--rms-text-muted); }
    .txn-amt { font-weight: 700; color: var(--rms-yellow); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="earnings-container">
    <h2 style="margin-bottom: 5px;">Today's Earnings</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Track your daily income sources.</p>

    <div class="total-card">
      <div class="total-label">Total Earned Today</div>
      <div class="total-amount">₦<span id="total-today">0.00</span></div>
    </div>

    <div class="source-grid">
      <div class="source-box">
        <div class="source-icon icon-box"><i class="fa-solid fa-box-open"></i></div>
        <div class="source-info">
          <div class="source-name">Mystery Boxes</div>
          <div class="source-val">₦<span id="earn-boxes">0</span></div>
        </div>
      </div>
      <div class="source-box">
        <div class="source-icon icon-wheel"><i class="fa-solid fa-dharmachakra"></i></div>
        <div class="source-info">
          <div class="source-name">Lucky Wheel</div>
          <div class="source-val">₦<span id="earn-wheel">0</span></div>
        </div>
      </div>
      <div class="source-box">
        <div class="source-icon icon-wealth"><i class="fa-solid fa-gem"></i></div>
        <div class="source-info">
          <div class="source-name">Wealth Center</div>
          <div class="source-val">₦<span id="earn-wealth">0</span></div>
        </div>
      </div>
      <div class="source-box">
        <div class="source-icon icon-ref"><i class="fa-solid fa-user-plus"></i></div>
        <div class="source-info">
          <div class="source-name">Referrals</div>
          <div class="source-val">₦<span id="earn-ref">0</span></div>
        </div>
      </div>
    </div>

    <div class="history-header">
      <h3>Recent Activity</h3>
    </div>
    <div id="earnings-list">
      <p class="text-muted" style="text-align:center; padding: 20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</p>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadEarnings() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      // Get start of today
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const { data: txns } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', user.id)
        .in('type', ['task_earning', 'wheel_win', 'wealth_claim', 'referral'])
        .gte('created_at', today.toISOString())
        .order('created_at', { ascending: false });

      let total = 0, boxes = 0, wheel = 0, wealth = 0, ref = 0;
      const list = document.getElementById('earnings-list');

      if (txns && txns.length > 0) {
        list.innerHTML = txns.map(t => {
          total += Number(t.amount);
          if(t.type === 'task_earning') boxes += Number(t.amount);
          if(t.type === 'wheel_win') wheel += Number(t.amount);
          if(t.type === 'wealth_claim') wealth += Number(t.amount);
          if(t.type === 'referral') ref += Number(t.amount);

          let icon = 'fa-box-open', color = 'var(--rms-yellow)';
          if(t.type === 'wheel_win') { icon = 'fa-dharmachakra'; color = 'var(--rms-vivid-red)'; }
          if(t.type === 'wealth_claim') { icon = 'fa-gem'; color = '#2ecc71'; }
          if(t.type === 'referral') { icon = 'fa-user-plus'; color = '#3498db'; }

          const time = new Date(t.created_at).toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="txn-row">
              <div class="txn-left">
                <div class="txn-icon-sm" style="color:${color}"><i class="fa-solid ${icon}"></i></div>
                <div>
                  <div class="txn-title">${t.description || t.type.replace('_', ' ')}</div>
                  <div class="txn-time">${time}</div>
                </div>
              </div>
              <div class="txn-amt">+₦${Number(t.amount).toLocaleString()}</div>
            </div>
          `;
        }).join('');
      } else {
        list.innerHTML = '<p class="text-muted" style="text-align:center; padding: 20px;">No earnings recorded today yet.</p>';
      }

      document.getElementById('total-today').textContent = total.toLocaleString();
      document.getElementById('earn-boxes').textContent = boxes.toLocaleString();
      document.getElementById('earn-wheel').textContent = wheel.toLocaleString();
      document.getElementById('earn-wealth').textContent = wealth.toLocaleString();
      document.getElementById('earn-ref').textContent = ref.toLocaleString();
    }
    loadEarnings();
  </script>
</body>
</html>
