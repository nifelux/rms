<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .profile-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .profile-header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--rms-border); }
    .avatar-large { 
      width: 90px; height: 90px; background: linear-gradient(135deg, var(--rms-bg-card), #1a2050); 
      border: 2px solid var(--rms-yellow); border-radius: 50%; 
      display: flex; align-items: center; justify-content: center; 
      margin: 0 auto 16px; font-size: 2.5rem; color: var(--rms-yellow);
      box-shadow: 0 0 20px rgba(255,215,0,0.15);
    }
    .vip-badge { 
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--rms-vivid-red), var(--rms-red)); 
      color: white; padding: 6px 16px; border-radius: 20px; 
      font-size: 0.85rem; font-weight: 700; margin-top: 12px; letter-spacing: 0.5px;
    }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-box { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--rms-white); margin-bottom: 4px; }
    .stat-lbl { font-size: 0.75rem; color: var(--rms-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .menu-list { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 16px; overflow: hidden; }
    .menu-item { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); 
      text-decoration: none; color: white; transition: background 0.2s;
    }
    .menu-item:hover { background: rgba(255,255,255,0.02); }
    .menu-item:last-child { border-bottom: none; }
    .menu-item-left { display: flex; align-items: center; gap: 14px; }
    .menu-item-left i { width: 20px; text-align: center; color: var(--rms-yellow); font-size: 1.1rem; }
    .menu-item-right i { color: var(--rms-text-muted); font-size: 0.8rem; }
    
    .menu-item.logout { color: var(--rms-vivid-red); }
    .menu-item.logout .menu-item-left i { color: var(--rms-vivid-red); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="profile-container">
    
    <!-- Profile Header -->
    <div class="profile-header">
      <div class="avatar-large"><i class="fa-solid fa-user"></i></div>
      <h2 id="user-name" style="margin: 0 0 4px 0; font-size: 1.5rem;">Loading...</h2>
      <p id="user-email" class="text-muted" style="margin: 0; font-size: 0.9rem;">...</p>
      <div class="vip-badge" id="user-tier">
        <i class="fa-solid fa-crown"></i> <span>NEWBIE</span>
      </div>
    </div>

    <!-- Wallet Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num text-yellow">₦<span id="wallet-balance">0</span></div>
        <div class="stat-lbl">Available Balance</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">₦<span id="total-earned">0</span></div>
        <div class="stat-lbl">Total Earned</div>
      </div>
    </div>

    <!-- Settings Menu -->
    <h4 style="margin: 0 0 12px 0; font-size: 0.9rem; color: var(--rms-text-muted); text-transform: uppercase; letter-spacing: 1px;">Account Settings</h4>
    <div class="menu-list">
      <a href="/settings.html" class="menu-item">
        <div class="menu-item-left"><i class="fa-solid fa-gear"></i> App Settings</div>
        <div class="menu-item-right"><i class="fa-solid fa-chevron-right"></i></div>
      </a>
      <a href="/support.html" class="menu-item">
        <div class="menu-item-left"><i class="fa-solid fa-headset"></i> Contact Support</div>
        <div class="menu-item-right"><i class="fa-solid fa-chevron-right"></i></div>
      </a>
      <a href="/about.html" class="menu-item">
        <div class="menu-item-left"><i class="fa-solid fa-circle-info"></i> About RMS</div>
        <div class="menu-item-right"><i class="fa-solid fa-chevron-right"></i></div>
      </a>
      <a href="#" class="menu-item logout" id="logout-btn">
        <div class="menu-item-left"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
        <div class="menu-item-right"><i class="fa-solid fa-chevron-right"></i></div>
      </a>
    </div>

  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      // Fetch Profile
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
      document.getElementById('user-name').textContent = profile.full_name || 'User';
      document.getElementById('user-email').textContent = profile.email;
      
      const tierBadge = document.getElementById('user-tier');
      tierBadge.querySelector('span').textContent = profile.vip_level.toUpperCase();
      if(profile.vip_level !== 'newbie') {
        tierBadge.style.background = 'linear-gradient(135deg, var(--rms-yellow), #e6c200)';
        tierBadge.style.color = '#0a0e27';
      }

      // Fetch Wallet
      const { data: wallet } = await supabase.from('wallets').select('balance, total_earned').eq('user_id', user.id).single();
      if (wallet) {
        document.getElementById('wallet-balance').textContent = Number(wallet.balance).toLocaleString();
        document.getElementById('total-earned').textContent = Number(wallet.total_earned || 0).toLocaleString();
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      if(confirm('Are you sure you want to logout?')) {
        await supabase.auth.signOut();
        window.location.href = '/login.html';
      }
    });

    loadProfile();
  </script>
</body>
</html>
