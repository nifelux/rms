<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoyalVest — User Details</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    :root { --admin-ink:#071a3d; --admin-panel:#0c2856; --admin-line:rgba(232,186,79,.2); --admin-gold:#f5d46e; --admin-muted:#a7b8d3; }
    body { background:linear-gradient(135deg,#030a19 0%,#071a3d 60%,#0b2554 100%); color:#f7f4eb; min-height:100vh; }
    .user-page { max-width:1280px; margin:0 auto; padding:2rem 1.25rem 4rem; }
    .user-topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.25rem; }
    .user-topbar h1 { margin:0; font-family:Georgia,serif; }
    .user-topbar p { color:var(--admin-muted); margin:.35rem 0 0; }
    .user-actions { display:flex; flex-wrap:wrap; gap:.6rem; }
    .profile-hero { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.5rem; background:linear-gradient(135deg,rgba(18,55,106,.95),rgba(4,15,37,.96)); border:1px solid var(--admin-line); border-radius:22px; box-shadow:0 18px 50px rgba(0,0,0,.22); }
    .profile-main { display:flex; align-items:center; gap:1rem; min-width:0; }
    .avatar { width:68px; height:68px; display:grid; place-items:center; flex:none; border-radius:50%; background:linear-gradient(135deg,#f5d46e,#d69d26); color:#071a3d; font-size:1.6rem; font-weight:800; }
    .profile-main h2 { margin:0; font-family:Georgia,serif; overflow-wrap:anywhere; }
    .profile-main p { margin:.3rem 0 0; color:var(--admin-muted); overflow-wrap:anywhere; }
    .profile-badges { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.6rem; }
    .badge { display:inline-flex; align-items:center; padding:.35rem .65rem; border-radius:999px; font-size:.75rem; font-weight:700; }
    .badge-gold { background:rgba(245,212,110,.16); color:var(--admin-gold); border:1px solid rgba(245,212,110,.3); }
    .badge-green { background:rgba(111,213,94,.14); color:#6fd55e; border:1px solid rgba(111,213,94,.3); }
    .badge-red { background:rgba(239,68,68,.14); color:#fca5a5; border:1px solid rgba(239,68,68,.3); }
    .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1rem; margin:1rem 0; }
    .summary-card, .detail-card { background:linear-gradient(155deg,rgba(12,38,82,.9),rgba(4,15,37,.94)); border:1px solid var(--admin-line); border-radius:18px; box-shadow:0 12px 32px rgba(0,0,0,.14); }
    .summary-card { padding:1rem; }
    .summary-label { color:var(--admin-muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; }
    .summary-value { display:block; margin-top:.35rem; color:var(--admin-gold); font-size:1.45rem; font-weight:800; overflow-wrap:anywhere; }
    .content-grid { display:grid; grid-template-columns:minmax(260px,.85fr) minmax(0,1.6fr); gap:1rem; align-items:start; }
    .detail-card { padding:1.15rem; margin-bottom:1rem; min-width:0; }
    .detail-card h3 { margin:0 0 1rem; font-family:Georgia,serif; }
    .info-list { display:grid; gap:.7rem; margin:0; }
    .info-row { display:flex; justify-content:space-between; gap:1rem; padding-bottom:.65rem; border-bottom:1px solid rgba(232,186,79,.1); }
    .info-row:last-child { border-bottom:0; padding-bottom:0; }
    .info-row dt { color:var(--admin-muted); }
    .info-row dd { margin:0; text-align:right; overflow-wrap:anywhere; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:620px; border-collapse:collapse; }
    th,td { padding:.7rem .55rem; text-align:left; border-bottom:1px solid rgba(232,186,79,.12); vertical-align:top; white-space:nowrap; }
    th { color:var(--admin-muted); font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; }
    td { color:#f7f4eb; }
    .empty { color:var(--admin-muted); margin:0; }
    .notice { padding:.8rem 1rem; margin-bottom:1rem; border-radius:12px; background:rgba(239,68,68,.14); color:#fecaca; border:1px solid rgba(239,68,68,.28); }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:.55rem .9rem; border:1px solid rgba(245,212,110,.35); border-radius:999px; background:rgba(7,26,61,.5); color:var(--admin-gold); font-weight:700; text-decoration:none; cursor:pointer; }
    .btn-primary { background:linear-gradient(135deg,#f5d46e,#e8ba4f); color:#071a3d; border-color:#f5d46e; }
    .btn-danger { color:#fecaca; border-color:rgba(239,68,68,.45); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    @media (max-width:860px) { .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .content-grid { grid-template-columns:1fr; } .profile-hero { align-items:flex-start; flex-direction:column; } }
    @media (max-width:560px) { .user-page { padding:1rem .75rem 3rem; } .user-topbar { align-items:flex-start; flex-direction:column; } .user-topbar h1 { font-size:1.8rem; } .summary-grid { gap:.65rem; } .summary-card { padding:.8rem; } .summary-value { font-size:1.1rem; } .profile-hero { padding:1rem; } .profile-main { align-items:flex-start; } .avatar { width:54px; height:54px; font-size:1.25rem; } .info-row { align-items:flex-start; flex-direction:column; gap:.2rem; } .info-row dd { text-align:left; } }
  </style>
</head>
<body>
  <nav class="navbar"><div class="logo"><strong>Admin Panel</strong></div><a href="index.html#users">Back to Users</a></nav>
  <main class="user-page">
    <div id="page-error" class="notice" hidden></div>
    <div id="loading" class="detail-card">Loading user profile…</div>
    <div id="user-content" hidden>
      <div class="user-topbar">
        <div><h1>User Details</h1><p>Review the account, wallet, and complete activity history.</p></div>
        <div class="user-actions"><a class="btn" href="index.html#users">← Back to Users</a><button class="btn" id="refresh-btn">Refresh</button></div>
      </div>
      <section class="profile-hero">
        <div class="profile-main"><div class="avatar" id="avatar">RV</div><div><h2 id="user-name">—</h2><p id="user-email">—</p><div class="profile-badges" id="profile-badges"></div></div></div>
        <div class="user-actions"><button class="btn" id="freeze-btn">Freeze</button><button class="btn btn-danger" id="ban-btn">Ban</button></div>
      </section>
      <section class="summary-grid" id="summary-grid"></section>
      <div class="content-grid">
        <div>
          <section class="detail-card"><h3>Profile information</h3><dl class="info-list" id="profile-info"></dl></section>
          <section class="detail-card"><h3>Wallet</h3><dl class="info-list" id="wallet-info"></dl></section>
        </div>
        <div>
          <section class="detail-card"><h3>Deposits</h3><div class="table-wrap" id="deposits-table"></div></section>
          <section class="detail-card"><h3>Withdrawals</h3><div class="table-wrap" id="withdrawals-table"></div></section>
          <section class="detail-card"><h3>Investments</h3><div class="table-wrap" id="investments-table"></div></section>
          <section class="detail-card"><h3>Welfare plans</h3><div class="table-wrap" id="welfare-table"></div></section>
          <section class="detail-card"><h3>Transactions</h3><div class="table-wrap" id="transactions-table"></div></section>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://jytmnukzvxirnafukbck.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5dG1udWt6dnhpcm5hZnVrYmNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNjQ3MjUsImV4cCI6MjA5OTc0MDcyNX0.ZvGUPTW7dJ3UxL2N1TW0lBCe3H4559HaUEhks7vEbEw');
    const userId = new URLSearchParams(location.search).get('id');
    let current;
    const $ = id => document.getElementById(id);
    const esc = value => { const node = document.createElement('span'); node.textContent = value ?? '—'; return node.innerHTML; };
    const money = value => `₦${Number(value || 0).toLocaleString()}`;
    const date = value => value ? new Date(value).toLocaleString() : '—';
    const status = value => `<span class="badge ${String(value||'').toLowerCase().includes('approved') || String(value||'').toLowerCase() === 'active' ? 'badge-green' : String(value||'').toLowerCase().includes('reject') || String(value||'').toLowerCase() === 'failed' ? 'badge-red' : 'badge-gold'}">${esc(value || '—')}</span>`;
    async function token() { return (await supabase.auth.getSession()).data.session?.access_token; }
    async function api(action, options = {}) { const accessToken = await token(); const response = await fetch(`/api/admin?action=${action}`, { ...options, headers: { 'Content-Type':'application/json', Authorization:`Bearer ${accessToken}`, ...(options.headers || {}) } }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`); return data; }
    function table(rows, columns, empty = 'No records found.') { if (!rows?.length) return `<p class="empty">${empty}</p>`; return `<table><thead><tr>${columns.map(c => `<th>${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${columns.map(c => `<td>${c.render(row)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
    function render(data) {
      current = data;
      const p = data.profile || {}, w = data.wallet || {};
      const name = p.full_name || p.email || 'Unnamed user';
      $('avatar').textContent = name.split(/\s+/).map(x => x[0]).join('').slice(0,2).toUpperCase();
      $('user-name').textContent = name; $('user-email').textContent = p.email || 'No email';
      $('profile-badges').innerHTML = `${p.vip_level ? `<span class="badge badge-gold">VIP ${esc(p.vip_level)}</span>` : ''}${p.is_banned ? '<span class="badge badge-red">Banned</span>' : '<span class="badge badge-green">Active</span>'}${p.is_frozen ? '<span class="badge badge-red">Frozen</span>' : ''}`;
      $('freeze-btn').textContent = p.is_frozen ? 'Unfreeze' : 'Freeze'; $('ban-btn').textContent = p.is_banned ? 'Unban' : 'Ban';
      $('summary-grid').innerHTML = `<div class="summary-card"><span class="summary-label">Balance</span><strong class="summary-value">${money(w.balance)}</strong></div><div class="summary-card"><span class="summary-label">Deposited</span><strong class="summary-value">${money(w.total_deposited)}</strong></div><div class="summary-card"><span class="summary-label">Withdrawn</span><strong class="summary-value">${money(w.total_withdrawn)}</strong></div><div class="summary-card"><span class="summary-label">Joined</span><strong class="summary-value">${esc(date(p.created_at))}</strong></div>`;
      $('profile-info').innerHTML = [['Full name',p.full_name],['Email',p.email],['Phone',p.phone],['VIP level',p.vip_level],['Referral code',p.referral_code],['Referred by',p.referred_by],['Last sign in',date(p.last_sign_in_at)],['Created',date(p.created_at)]].map(([label,value]) => `<div class="info-row"><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('');
      $('wallet-info').innerHTML = [['Balance',money(w.balance)],['Total deposited',money(w.total_deposited)],['Total withdrawn',money(w.total_withdrawn)],['Referral earnings',money(w.referral_earnings)],['Task earnings',money(w.task_earnings)],['Investment earnings',money(w.investment_earnings)]].map(([label,value]) => `<div class="info-row"><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('');
      $('deposits-table').innerHTML = table(data.deposits, [{label:'Amount',render:r=>money(r.amount)},{label:'Method',render:r=>esc(r.method || r.payment_method)},{label:'Reference',render:r=>esc(r.reference)},{label:'Status',render:r=>status(r.status)},{label:'Date',render:r=>esc(date(r.created_at))}]);
      $('withdrawals-table').innerHTML = table(data.withdrawals, [{label:'Amount',render:r=>money(r.amount)},{label:'Method',render:r=>esc(r.method)},{label:'Status',render:r=>status(r.status)},{label:'Date',render:r=>esc(date(r.created_at))}]);
      $('investments-table').innerHTML = table(data.investments, [{label:'Product',render:r=>esc(r.products?.name || r.product_name)},{label:'Amount',render:r=>money(r.amount || r.investment_amount)},{label:'Income',render:r=>money(r.total_income)},{label:'Status',render:r=>status(r.status)},{label:'Date',render:r=>esc(date(r.created_at))}]);
      $('welfare-table').innerHTML = table(data.welfare, [{label:'Plan',render:r=>esc(r.plan_name || r.name)},{label:'Amount',render:r=>money(r.amount)},{label:'Status',render:r=>status(r.status)},{label:'Date',render:r=>esc(date(r.created_at))}]);
      $('transactions-table').innerHTML = table(data.transactions, [{label:'Type',render:r=>esc(r.type)},{label:'Amount',render:r=>money(r.amount)},{label:'Status',render:r=>status(r.status)},{label:'Reference',render:r=>esc(r.reference)},{label:'Date',render:r=>esc(date(r.created_at))}]);
    }
    async function load() { if (!userId) throw new Error('Missing user id. Return to Users and choose a user.'); const data = await api(`userDetail&user_id=${encodeURIComponent(userId)}`); render(data); $('loading').hidden = true; $('user-content').hidden = false; }
    async function toggle(action, button) { button.disabled = true; try { await api(action, { method:'POST', body:JSON.stringify({ user_id:userId }) }); await load(); } catch (error) { $('page-error').textContent = error.message; $('page-error').hidden = false; } finally { button.disabled = false; } }
    $('refresh-btn').addEventListener('click', () => load().catch(error => { $('page-error').textContent = error.message; $('page-error').hidden = false; }));
    $('freeze-btn').addEventListener('click', e => toggle(current?.profile?.is_frozen ? 'unfreezeUser' : 'freezeUser', e.currentTarget));
    $('ban-btn').addEventListener('click', e => toggle(current?.profile?.is_banned ? 'unbanUser' : 'banUser', e.currentTarget));
    const session = (await supabase.auth.getSession()).data.session;
    if (!session) location.href = '../login.html'; else load().catch(error => { $('loading').hidden = true; $('page-error').textContent = error.message; $('page-error').hidden = false; });
  </script>
</body>
</html>
