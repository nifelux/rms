<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Change Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .pwd-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .security-icon { text-align: center; margin-bottom: 24px; }
    .security-icon i { font-size: 3rem; color: var(--rms-yellow); background: rgba(255,215,0,0.1); width: 80px; height: 80px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; font-weight: 600; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--rms-text-muted); cursor: pointer; }
    .form-control { 
      width: 100%; padding: 14px; background: var(--rms-bg-card); border: 1px solid var(--rms-border);
      border-radius: 10px; color: white; font-size: 1rem; box-sizing: border-box;
    }
    .form-control:focus { outline: none; border-color: var(--rms-yellow); }
    
    .requirements { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .req-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; }
    .req-item:last-child { margin-bottom: 0; }
    .req-item i { font-size: 0.8rem; }
    .req-item.valid { color: #2ecc71; }
    .req-item.valid i { color: #2ecc71; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="pwd-container">
    <div class="security-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2 style="text-align:center; margin-bottom: 5px;">Change Password</h2>
    <p class="text-muted" style="text-align:center; margin-bottom: 30px;">Update your account security credentials.</p>

    <div class="requirements">
      <div class="req-item" id="req-length"><i class="fa-regular fa-circle"></i> At least 6 characters</div>
      <div class="req-item" id="req-match"><i class="fa-regular fa-circle"></i> Passwords match</div>
    </div>

    <form id="pwd-form">
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <input type="password" id="new-password" class="form-control" placeholder="Enter new password" required>
          <i class="fa-regular fa-eye" onclick="togglePwd('new-password', this)"></i>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required>
          <i class="fa-regular fa-eye" onclick="togglePwd('confirm-password', this)"></i>
        </div>
      </div>
      <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 16px;">
        <i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Update Password
      </button>
    </form>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    const newPwd = document.getElementById('new-password');
    const confPwd = document.getElementById('confirm-password');
    const reqLength = document.getElementById('req-length');
    const reqMatch = document.getElementById('req-match');

    function checkRequirements() {
      const lenValid = newPwd.value.length >= 6;
      const matchValid = newPwd.value === confPwd.value && confPwd.value !== '';

      reqLength.className = `req-item ${lenValid ? 'valid' : ''}`;
      reqLength.innerHTML = `<i class="fa-solid fa-${lenValid ? 'check-circle' : 'circle'}"></i> At least 6 characters`;
      
      reqMatch.className = `req-item ${matchValid ? 'valid' : ''}`;
      reqMatch.innerHTML = `<i class="fa-solid fa-${matchValid ? 'check-circle' : 'circle'}"></i> Passwords match`;
    }

    newPwd.addEventListener('input', checkRequirements);
    confPwd.addEventListener('input', checkRequirements);

    window.togglePwd = (id, icon) => {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
      else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
    };

    document.getElementById('pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (newPwd.value.length < 6 || newPwd.value !== confPwd.value) {
        alert('Please ensure passwords are at least 6 characters and match.');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating...';
      btn.disabled = true;

      const { error } = await supabase.auth.updateUser({ password: newPwd.value });

      if (error) {
        alert(error.message);
      } else {
        alert('Password updated successfully! Please login again if prompted.');
        e.target.reset();
        checkRequirements();
      }
      btn.innerHTML = '<i class="fa-solid fa-lock"></i> Update Password';
      btn.disabled = false;
    });
  </script>
</body>
</html>
