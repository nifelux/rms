<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — My Team</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .team-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    
    .referral-card { 
      background: linear-gradient(135deg, #11163a, #1a2050); 
      border: 1px solid var(--rms-yellow); border-radius: 16px; 
      padding: 24px; text-align: center; margin-bottom: 24px;
      position: relative; overflow: hidden;
    }
    .referral-card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 70%);
    }
    .ref-label { font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; position: relative; }
    .ref-code { 
      font-size: 2rem; font-weight: 800; letter-spacing: 3px; color: var(--rms-yellow); 
      margin-bottom: 16px; position: relative;
    }
    .copy-btn { 
      background: var(--rms-vivid-red); color: white; border: none; 
      padding: 10px 24px; border-radius: 999px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      position: relative; transition: transform 0.2s;
    }
    .copy-btn:active { transform: scale(0.95); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .stat-box { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 14px 8px; text-align: center; }
    .stat-num { font-size: 1.3rem; font-weight: 800; color: var(--rms-white); margin-bottom: 4px; }
    .stat-lbl { font-size: 0.65rem; color: var(--rms-text-muted); text-transform: uppercase; }

    .team-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .team-list-header h3 { margin: 0; font-size: 1.1rem; }
    
    .member-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); 
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .member-info { display: flex; align-items: center; gap: 12px; }
    .member-avatar { 
      width: 40px; height: 40px; background: rgba(255,255,255,0.05); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: var(--rms-text-muted); font-size: 1rem;
    }
    .member-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .member-date { font-size: 0.75rem; color: var(--rms-text-muted); }
    
    .status-badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }
    .status-active { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .status-inactive { background: rgba(255,255,255,0.05); color: var(--rms-text-muted); }

    .empty-team { text-align: center; padding: 40px 20px; color: var(--rms-text-muted); }
    .empty-team i { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="team-container">
    <h2 style="margin-bottom: 5px;">My Team</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Invite friends and earn rewards.</p>

    <!-- Referral Card -->
    <div class="referral-card">
      <div class="ref-label">Your Referral Code</div>
      <div class="ref-code" id="ref-code">------</div>
      <button class="copy-btn" onclick="copyReferral()">
        <i class="fa-regular fa-copy"></i> Copy Referral Link
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num" id="total-refs">0</div>
        <div class="stat-lbl">Total Refs</div>
      </div>
      <div class="stat-box">
        <div class="stat-num text-yellow" id="active-downlines">0</div>
        <div class="stat-lbl">Active <i class="fa-solid fa-circle-info" style="font-size:0.6rem;"></i></div>
      </div>
      <div class="stat-box">
        <div class="stat-num text-red" id="wheel-spins">0</div>
        <div class="stat-lbl">Wheel Spins</div>
      </div>
    </div>

    <!-- Team List -->
    <div class="team-list-header">
      <h3>Referred Users</h3>
      <span class="text-muted" style="font-size: 0.85rem;" id="list-count">0 members</span>
    </div>
    
    <div id="team-list">
      <div class="empty-team">
        <i class="fa-solid fa-users-slash"></i>
        <p>Loading team data...</p>
      </div>
    </div>

  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadTeam() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      // 1. Get Profile & Ref Code
      const { data: profile } = await supabase.from('profiles').select('referral_code').eq('id', user.id).single();
      document.getElementById('ref-code').textContent = profile.referral_code;

      // 2. Fetch all direct referrals
      // Note: If RLS blocks this, you may need to use an API endpoint like /api/user?action=getTeam
      const { data: referrals, error } = await supabase
        .from('profiles')
        .select('id, full_name, email, created_at')
        .eq('referred_by', user.id)
        .order('created_at', { ascending: false });

      if (error || !referrals) {
        document.getElementById('team-list').innerHTML = '<div class="empty-team"><i class="fa-solid fa-lock"></i><p>Unable to load team. Please check permissions.</p></div>';
        return;
      }

      document.getElementById('total-refs').textContent = referrals.length;
      document.getElementById('list-count').textContent = `${referrals.length} members`;

      // 3. Calculate Active Downlines (Referrals with at least one approved deposit)
      let activeCount = 0;
      const teamListEl = document.getElementById('team-list');
      
      if (referrals.length === 0) {
        teamListEl.innerHTML = '<div class="empty-team"><i class="fa-solid fa-user-plus"></i><p>You haven\'t referred anyone yet.<br>Share your link to start earning!</p></div>';
      } else {
        teamListEl.innerHTML = '';
        for (const ref of referrals) {
          // Check if this referral has an approved deposit
          const { count } = await supabase.from('deposits').select('*', { count: 'exact', head: true })
            .eq('user_id', ref.id).eq('status', 'approved');
          
          const isActive = count > 0;
          if (isActive) activeCount++;

          const initials = (ref.full_name || ref.email).substring(0, 2).toUpperCase();
          const date = new Date(ref.created_at).toLocaleDateString('en-NG', { month: 'short', day: 'numeric', year: 'numeric' });

          teamListEl.innerHTML += `
            <div class="member-card">
              <div class="member-info">
                <div class="member-avatar">${initials}</div>
                <div>
                  <div class="member-name">${ref.full_name || 'Anonymous User'}</div>
                  <div class="member-date">Joined ${date}</div>
                </div>
              </div>
              <div class="status-badge ${isActive ? 'status-active' : 'status-inactive'}">
                ${isActive ? 'Active' : 'Inactive'}
              </div>
            </div>
          `;
        }
      }

      // 4. Update Stats
      document.getElementById('active-downlines').textContent = activeCount;
      document.getElementById('wheel-spins').textContent = activeCount; // 1 spin per active downline
    }

    window.copyReferral = () => {
      const code = document.getElementById('ref-code').textContent;
      const link = `${window.location.origin}/register.html?ref=${code}`;
      navigator.clipboard.writeText(link);
      
      const btn = document.querySelector('.copy-btn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
      btn.style.background = '#2ecc71';
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.style.background = 'var(--rms-vivid-red)';
      }, 2000);
    };

    loadTeam();
  </script>
</body>
</html>
