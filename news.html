<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — News & Updates</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .news-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .news-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); 
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .news-date { font-size: 0.75rem; color: var(--rms-yellow); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .news-title { font-size: 1.1rem; font-weight: 700; color: var(--rms-white); margin-bottom: 10px; }
    .news-body { font-size: 0.9rem; color: var(--rms-text-muted); line-height: 1.5; }
    .news-tag { display: inline-block; background: rgba(255,26,26,0.1); color: var(--rms-vivid-red); padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; margin-top: 12px; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="news-container">
    <h2 style="margin-bottom: 5px;">News & Updates</h2>
    <p class="text-muted" style="margin-bottom: 24px;">Stay informed about the latest RMS features.</p>

    <div id="news-list">
      <!-- Injected by JS -->
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    // Mock data for demonstration (In production, fetch from a 'news' table)
    const newsData = [
      { date: 'Oct 24, 2023', title: 'Welcome to RMS 2.0!', body: 'We have completely redesigned the platform. Enjoy the new Mystery Box tasks, the Wealth Center for high-yield investments, and the Lucky Wheel for your referrals.', tag: 'Major Update' },
      { date: 'Oct 20, 2023', title: 'New Withdrawal Schedule Implemented', body: 'To ensure faster processing, withdrawals are now strictly scheduled by tier. M1/M2 on Mondays, M3/M4 on Tuesdays, and so on. Weekend withdrawals are paused.', tag: 'Policy' },
      { date: 'Oct 15, 2023', title: 'Lucky Wheel is Live', body: 'Every active downline now grants you 1 free spin on the Lucky Wheel every day. Invite more friends to increase your chances of winning up to ₦10,000!', tag: 'Feature' }
    ];

    const list = document.getElementById('news-list');
    list.innerHTML = newsData.map(n => `
      <div class="news-card">
        <div class="news-date"><i class="fa-regular fa-calendar"></i> ${n.date}</div>
        <div class="news-title">${n.title}</div>
        <div class="news-body">${n.body}</div>
        <div class="news-tag">${n.tag}</div>
      </div>
    `).join('');
  </script>
</body>
</html>
