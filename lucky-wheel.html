<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Lucky Wheel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%);
      min-height: 100vh;
      color: white;
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    .wheel-container { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    
    .page-header { 
      text-align: center; 
      margin-bottom: 28px;
      position: relative;
    }
    .page-header h2 { 
      font-size: 2.2rem; 
      font-weight: 900; 
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffd700, #ffed4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255,215,0,0.3);
    }
    .page-header p { 
      color: rgba(255,255,255,0.6); 
      font-size: 0.95rem;
    }

    /* Premium Spins Counter */
    .spins-counter {
      background: linear-gradient(135deg, rgba(255,215,0,0.15) 0%, rgba(255,193,7,0.05) 100%);
      border: 2px solid rgba(255,215,0,0.4);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(255,215,0,0.2);
    }
    .spins-counter::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .spins-icon {
      font-size: 2rem;
      color: #ffd700;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .spins-label { 
      font-size: 0.85rem; 
      color: rgba(255,255,255,0.7); 
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
    .spins-value { 
      font-size: 3rem; 
      font-weight: 900; 
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
      position: relative;
      z-index: 1;
    }
    .spins-sublabel {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    /* Premium Wheel Wrapper */
    .wheel-wrapper { 
      position: relative; 
      width: 100%; 
      max-width: 340px; 
      margin: 0 auto 32px;
    }
    
    .wheel-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 120%;
      background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
      pointer-events: none;
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
    
    .wheel-canvas { 
      width: 100%; 
      height: auto; 
      border-radius: 50%; 
      box-shadow: 0 0 60px rgba(255,215,0,0.3), 0 0 100px rgba(255,215,0,0.1);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      position: relative;
      z-index: 2;
    }
    
    .wheel-pointer { 
      position: absolute; 
      top: -15px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 40px; 
      height: 50px; 
      background: linear-gradient(135deg, #ff1a1a, #ff4444);
      clip-path: polygon(50% 100%, 0 0, 100% 0); 
      z-index: 10; 
      filter: drop-shadow(0 4px 12px rgba(255,26,26,0.5));
    }
    
    .wheel-center { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 70px; 
      height: 70px; 
      background: linear-gradient(135deg, #ffd700, #e6c200);
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 900; 
      color: #0a0e27; 
      font-size: 1.8rem;
      box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.3);
      z-index: 5;
      border: 4px solid rgba(255,255,255,0.2);
    }

    /* Premium Spin Button */
    .spin-btn { 
      width: 100%; 
      padding: 20px; 
      font-size: 1.3rem; 
      font-weight: 900; 
      border: none; 
      border-radius: 20px; 
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
      color: #0a0e27; 
      cursor: pointer; 
      transition: all 0.3s; 
      box-shadow: 0 12px 32px rgba(255,215,0,0.4);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .spin-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }
    .spin-btn:hover:not(:disabled) { 
      transform: translateY(-3px); 
      box-shadow: 0 16px 40px rgba(255,215,0,0.5);
    }
    .spin-btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      background: linear-gradient(135deg, #555, #777);
      color: #aaa;
      box-shadow: none;
    }
    .spin-btn:disabled::before { display: none; }

    /* Premium Section Title */
    .section-title { 
      font-size: 1.2rem; 
      font-weight: 800; 
      margin: 28px 0 16px 0; 
      display: flex; 
      align-items: center; 
      gap: 10px;
      color: white;
    }
    .section-title i { 
      color: #00d4ff;
      font-size: 1.1rem;
    }

    /* Premium History */
    .history-list { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }
    
    .history-item { 
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; 
      padding: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .history-item:hover {
      border-color: rgba(255,215,0,0.3);
      transform: translateX(4px);
    }
    
    .history-left { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
    }
    
    .history-icon { 
      width: 44px; 
      height: 44px; 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.2rem;
    }
    .history-icon.win { 
      background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,255,136,0.1));
      color: #00ff88;
      border: 1px solid rgba(0,255,136,0.3);
    }
    .history-icon.lose { 
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .history-title { 
      font-weight: 700; 
      font-size: 0.95rem; 
      margin-bottom: 4px;
      color: white;
    }
    .history-date { 
      font-size: 0.75rem; 
      color: rgba(255,255,255,0.5);
    }
    
    .history-amount { 
      font-weight: 900; 
      font-size: 1.1rem;
    }
    .history-amount.win { 
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0,255,136,0.3);
    }
    .history-amount.lose { 
      color: rgba(255,255,255,0.4);
    }

    /* Premium Modal - FIXED */
    .prize-modal { 
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .prize-modal.show { 
      opacity: 1; 
      pointer-events: auto;
    }
    
    .prize-content { 
      background: linear-gradient(135deg, #1a1f4e 0%, #0a0e27 100%);
      border: 3px solid #ffd700;
      border-radius: 32px;
      padding: 48px 36px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      animation: prizePop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 0 80px rgba(255,215,0,0.4), 0 0 120px rgba(255,215,0,0.2);
      position: relative;
    }
    
    .prize-content::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    
    @keyframes prizePop { 
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    
    .prize-icon { 
      font-size: 5rem; 
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
      animation: bounce 1s ease infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .prize-title { 
      font-size: 1.6rem; 
      font-weight: 900; 
      margin-bottom: 12px;
      color: white;
      position: relative;
      z-index: 1;
    }
    
    .prize-amount { 
      font-size: 3.5rem; 
      font-weight: 900; 
      color: #ffd700;
      margin-bottom: 28px;
      text-shadow: 0 0 30px rgba(255,215,0,0.6);
      position: relative;
      z-index: 1;
    }
    
    .prize-btn { 
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(135deg, #ffd700, #e6c200);
      border: none; 
      border-radius: 16px; 
      font-weight: 900; 
      font-size: 1.1rem; 
      color: #0a0e27; 
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 24px rgba(255,215,0,0.4);
    }
    .prize-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255,215,0,0.5);
    }

    .empty-history { 
      text-align: center; 
      padding: 40px 20px; 
      color: rgba(255,255,255,0.4); 
      font-size: 0.9rem;
    }
    .empty-history i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.3;
      display: block;
    }

    /* Confetti particles for wins */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 99999;
      animation: confettiFall 3s ease-out forwards;
    }
    
    @keyframes confettiFall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="wheel-container">
    <div class="page-header">
      <h2><i class="fa-solid fa-dharmachakra" style="color: #ffd700; margin-right: 8px;"></i>Lucky Wheel</h2>
      <p>Spin to win amazing prizes!</p>
    </div>

    <!-- Premium Spins Counter -->
    <div class="spins-counter">
      <div class="spins-icon"><i class="fa-solid fa-ticket"></i></div>
      <div class="spins-label">Available Spins</div>
      <div class="spins-value" id="spins-count">0</div>
      <div class="spins-sublabel">Invite friends to earn more spins</div>
    </div>

    <!-- Premium Wheel -->
    <div class="wheel-wrapper">
      <div class="wheel-glow"></div>
      <div class="wheel-pointer"></div>
      <canvas id="wheelCanvas" width="340" height="340" class="wheel-canvas"></canvas>
      <div class="wheel-center"><i class="fa-solid fa-star"></i></div>
    </div>

    <!-- Premium Spin Button -->
    <button class="spin-btn" id="spin-btn" onclick="spinWheel()">
      <i class="fa-solid fa-play" style="margin-right: 8px;"></i> Spin Now
    </button>

    <!-- Premium History Section -->
    <div class="section-title">
      <i class="fa-solid fa-clock-rotate-left"></i>
      Recent Wins
    </div>
    <div class="history-list" id="spin-history">
      <div class="empty-history">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        Loading...
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <!-- Premium Modal - FIXED -->
  <div class="prize-modal" id="prize-modal">
    <div class="prize-content">
      <div class="prize-icon" id="modal-icon">🎉</div>
      <div class="prize-title" id="modal-title">Congratulations!</div>
      <div class="prize-amount" id="prize-amount">₦0</div>
      <button class="prize-btn" onclick="closePrizeModal()">Awesome!</button>
    </div>
  </div>

  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    let wheelConfigs = [];
    let currentRotation = 0;

    async function initWheel() {
      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/wheel?action=getWheelConfig', { 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        if (!res.ok) throw new Error('Failed to load wheel');
        
        const data = await res.json();
        wheelConfigs = data.configs;
        document.getElementById('spins-count').textContent = data.wheel_spins;
        
        const spinBtn = document.getElementById('spin-btn');
        if (data.wheel_spins < 1) {
          spinBtn.disabled = true;
          spinBtn.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 8px;"></i>No Spins';
        }

        drawWheel();
        loadSpinHistory();
      } catch (err) {
        console.error('Init error:', err);
        showToast('Failed to load wheel', 'error');
      }
    }

    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 15;
      const segmentAngle = (2 * Math.PI) / wheelConfigs.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      wheelConfigs.forEach((config, index) => {
        const startAngle = index * segmentAngle - Math.PI / 2;
        const endAngle = startAngle + segmentAngle;

        // Draw segment with gradient
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
        gradient.addColorStop(0, config.color || '#333');
        gradient.addColorStop(1, adjustColor(config.color || '#333', -30));
        ctx.fillStyle = gradient;
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Draw text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + segmentAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Inter';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        const text = config.prize_amount === 0 ? 'TRY AGAIN' : `₦${config.prize_amount}`;
        ctx.fillText(text, radius - 20, 5);
        ctx.restore();
      });
    }

    function adjustColor(color, amount) {
      const num = parseInt(color.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
      return `#${(0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1)}`;
    }

    function createConfetti() {
      const colors = ['#ffd700', '#00ff88', '#00d4ff', '#ff1a1a', '#ff4444', '#ffffff'];
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 2 + 's';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }

    window.spinWheel = async () => {
      const spinBtn = document.getElementById('spin-btn');
      spinBtn.disabled = true;

      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/wheel?action=spinWheel', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const canvas = document.getElementById('wheelCanvas');
        const segmentAngle = 360 / wheelConfigs.length;
        const winningIndex = wheelConfigs.findIndex(c => c.id === data.segment_id);
        
        const targetRotation = 360 * 5 + (360 - (winningIndex * segmentAngle)) - (segmentAngle / 2);
        currentRotation += targetRotation;
        
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
          const modal = document.getElementById('prize-modal');
          
          if (data.is_try_again) {
            document.getElementById('modal-icon').textContent = '😢';
            document.getElementById('modal-title').textContent = 'Better Luck Next Time!';
            document.getElementById('prize-amount').textContent = 'Try Again';
            document.getElementById('prize-amount').style.color = '#95A5A6';
          } else {
            document.getElementById('modal-icon').textContent = '';
            document.getElementById('modal-title').textContent = 'Congratulations!';
            document.getElementById('prize-amount').textContent = `₦${data.prize.toLocaleString()}`;
            document.getElementById('prize-amount').style.color = '#ffd700';
            createConfetti();
          }
          
          modal.classList.add('show');
          document.getElementById('spins-count').textContent = data.spins_remaining;
          
          if (data.spins_remaining < 1) {
            spinBtn.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 8px;"></i>No Spins';
          } else {
            spinBtn.innerHTML = '<i class="fa-solid fa-play" style="margin-right: 8px;"></i>Spin Again';
          }
          spinBtn.disabled = false;
          loadSpinHistory();
        }, 4000);

      } catch (err) {
        console.error('Spin error:', err);
        showToast(err.message, 'error');
        spinBtn.disabled = false;
      }
    };

    window.closePrizeModal = () => {
      document.getElementById('prize-modal').classList.remove('show');
    };

    async function loadSpinHistory() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: history } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', user.id)
        .in('type', ['wheel_win', 'wheel_spin'])
        .order('created_at', { ascending: false })
        .limit(5);

      const list = document.getElementById('spin-history');
      if (!history || history.length === 0) {
        list.innerHTML = '<div class="empty-history"><i class="fa-solid fa-dharmachakra"></i>No spins yet. Try your luck!</div>';
        return;
      }

      list.innerHTML = history.map(t => {
        const isWin = t.type === 'wheel_win' && t.amount > 0;
        const date = new Date(t.created_at).toLocaleDateString('en-NG', { 
          month: 'short', 
          day: 'numeric', 
          hour: '2-digit', 
          minute: '2-digit' 
        });
        return `
          <div class="history-item">
            <div class="history-left">
              <div class="history-icon ${isWin ? 'win' : 'lose'}">
                <i class="fa-solid ${isWin ? 'fa-trophy' : 'fa-rotate-right'}"></i>
              </div>
              <div>
                <div class="history-title">${isWin ? 'Wheel Win' : 'Try Again'}</div>
                <div class="history-date">${date}</div>
              </div>
            </div>
            <div class="history-amount ${isWin ? 'win' : 'lose'}">
              ${isWin ? `+₦${Number(t.amount).toLocaleString()}` : '₦0'}
            </div>
          </div>
        `;
      }).join('');
    }

    initWheel();
  </script>
</body>
</html>
