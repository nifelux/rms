<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Customer Support</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .support-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
    .action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 20px; text-decoration: none; color: var(--rms-white); transition: 0.2s; }
    .action-btn:hover { border-color: var(--rms-yellow); transform: translateY(-2px); }
    .action-btn.telegram i { color: #0088cc; font-size: 1.8rem; margin-bottom: 10px; }
    .action-btn.whatsapp i { color: #25D366; font-size: 1.8rem; margin-bottom: 10px; }
    .action-btn span { font-size: 0.9rem; font-weight: 600; }

    .ticket-form { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 16px; padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--rms-border); border-radius: 10px; color: white; font-size: 0.95rem; box-sizing: border-box; font-family: inherit; }
    .form-control:focus { outline: none; border-color: var(--rms-yellow); }
    textarea.form-control { resize: vertical; min-height: 100px; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="support-container">
    <h2 style="margin-bottom: 5px;">Need Help?</h2>
    <p class="text-muted" style="margin-bottom: 24px;">Our support team is available 24/7.</p>

    <div class="quick-actions">
      <a href="https://t.me/your_telegram_handle" target="_blank" class="action-btn telegram">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
      </a>
      <a href="https://wa.me/your_whatsapp_number" target="_blank" class="action-btn whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>WhatsApp</span>
      </a>
    </div>

    <h3 style="margin-bottom: 16px; font-size: 1.1rem;">Submit a Ticket</h3>
    <form class="ticket-form" id="support-form">
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="subject" class="form-control" placeholder="Brief description of your issue" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="message" class="form-control" placeholder="Provide details about your issue..." required></textarea>
      </div>
      <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 14px;">
        <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Send Message
      </button>
    </form>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    // ⚠️ REPLACE WITH YOUR ACTUAL KEYS ⚠️
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    document.getElementById('support-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.disabled = true;

      try {
        const { data: { user } } = await supabase.auth.getUser();
        if(!user) throw new Error('Please login first.');

        const token = (await supabase.auth.getSession()).data.session.access_token;
        // FIX: Changed action from 'createTicket' to 'create' to match backend
        const res = await fetch('/api/support?action=create', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ subject: document.getElementById('subject').value, message: document.getElementById('message').value })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to send ticket');
        
        alert('Ticket submitted successfully!');
        e.target.reset();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
