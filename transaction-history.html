<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Transaction History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .history-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    
    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .filter-tab { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); color: var(--rms-text-muted);
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .filter-tab.active { background: var(--rms-yellow); color: #0a0e27; border-color: var(--rms-yellow); }

    /* Transaction List */
    .txn-list { display: flex; flex-direction: column; gap: 12px; }
    .txn-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; 
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .txn-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .txn-icon { 
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .icon-in { background: rgba(255,215,0,0.1); color: var(--rms-yellow); }
    .icon-out { background: rgba(255,26,26,0.1); color: var(--rms-vivid-red); }
    .icon-pending { background: rgba(255,255,255,0.05); color: var(--rms-text-muted); }
    
    .txn-info { flex: 1; }
    .txn-title { font-weight: 600; font-size: 0.9rem; color: var(--rms-white); margin-bottom: 2px; }
    .txn-date { font-size: 0.75rem; color: var(--rms-text-muted); }
    
    .txn-right { text-align: right; }
    .txn-amount { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .amt-in { color: var(--rms-yellow); }
    .amt-out { color: var(--rms-vivid-red); }
    .status-badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; font-weight: 700; text-transform: uppercase; }
    .status-completed { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .status-pending { background: rgba(255,215,0,0.15); color: var(--rms-yellow); }
    .status-rejected { background: rgba(255,26,26,0.15); color: var(--rms-vivid-red); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--rms-text-muted); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="history-container">
    <h2 style="margin-bottom: 5px;">Transaction History</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Track all your financial activities.</p>

    <div class="filter-tabs">
      <div class="filter-tab active" onclick="filterTxns('all', this)">All</div>
      <div class="filter-tab" onclick="filterTxns('income', this)">Income</div>
      <div class="filter-tab" onclick="filterTxns('expense', this)">Expense</div>
    </div>

    <div id="txn-list" class="txn-list">
      <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:1.5rem;"></i><p style="margin-top:10px;">Loading transactions...</p></div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    let allTxns = [];

    // Define transaction types for UI mapping
    const txnConfig = {
      'deposit': { title: 'Wallet Deposit', icon: 'fa-arrow-down', type: 'in' },
      'withdrawal': { title: 'Withdrawal', icon: 'fa-arrow-up', type: 'out' },
      'tier_upgrade': { title: 'VIP Tier Upgrade', icon: 'fa-crown', type: 'out' },
      'task_earning': { title: 'Mystery Box Reward', icon: 'fa-box-open', type: 'in' },
      'wealth_invest': { title: 'Wealth Investment', icon: 'fa-gem', type: 'out' },
      'wealth_claim': { title: 'Wealth Claim', icon: 'fa-hand-holding-dollar', type: 'in' },
      'referral': { title: 'Referral Bonus', icon: 'fa-users', type: 'in' },
      'wheel_win': { title: 'Lucky Wheel Win', icon: 'fa-dharmachakra', type: 'in' },
      'admin_credit': { title: 'Admin Credit', icon: 'fa-shield-halved', type: 'in' },
      'admin_debit': { title: 'Admin Debit', icon: 'fa-shield-halved', type: 'out' }
    };

    async function loadHistory() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      const { data: txns } = await supabase.from('transactions').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      allTxns = txns || [];
      renderTxns('all');
    }

    function renderTxns(filter) {
      const list = document.getElementById('txn-list');
      let filtered = allTxns;
      
      if (filter === 'income') filtered = allTxns.filter(t => txnConfig[t.type]?.type === 'in');
      if (filter === 'expense') filtered = allTxns.filter(t => txnConfig[t.type]?.type === 'out');

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-receipt" style="font-size:2rem; margin-bottom:10px; opacity:0.5;"></i><p>No transactions found.</p></div>';
        return;
      }

      list.innerHTML = filtered.map(t => {
        const config = txnConfig[t.type] || { title: t.type, icon: 'fa-circle', type: 'out' };
        const date = new Date(t.created_at).toLocaleDateString('en-NG', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const sign = config.type === 'in' ? '+' : '-';
        const amtClass = config.type === 'in' ? 'amt-in' : 'amt-out';
        const iconClass = t.status === 'pending' ? 'icon-pending' : (config.type === 'in' ? 'icon-in' : 'icon-out');
        
        return `
          <div class="txn-card">
            <div class="txn-left">
              <div class="txn-icon ${iconClass}"><i class="fa-solid ${config.icon}"></i></div>
              <div class="txn-info">
                <div class="txn-title">${config.title}</div>
                <div class="txn-date">${date}</div>
              </div>
            </div>
            <div class="txn-right">
              <div class="txn-amount ${amtClass}">${sign}${Number(t.amount).toLocaleString()}</div>
              <div class="status-badge status-${t.status}">${t.status}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.filterTxns = (filter, el) => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderTxns(filter);
    };

    loadHistory();
  </script>
</body>
</html>
