<html lang="en">

  <title>RMS — Contact Us</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .contact-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .contact-card { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 16px; padding: 24px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
    .contact-icon { width: 50px; height: 50px; background: rgba(255,215,0,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--rms-yellow); flex-shrink: 0; }
    .contact-info h4 { margin: 0 0 4px 0; font-size: 0.8rem; color: var(--rms-text-muted); text-transform: uppercase; font-weight: 600; }
    .contact-info p { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--rms-white); word-break: break-all; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="contact-container">
    <h2 style="margin-bottom: 5px;">Contact Information</h2>
    <p class="text-muted" style="margin-bottom: 24px;">Reach out to the RMS corporate team.</p>

    <div class="contact-card">
      <div class="contact-icon"><i class="fa-regular fa-envelope"></i></div>
      <div class="contact-info">
        <h4>Email Support</h4>
        <p>support@rms-platform.com</p>
      </div>
    </div>

    <div class="contact-card">
      <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
      <div class="contact-info">
        <h4>Customer Service</h4>
        <p>+234 800 000 0000</p>
      </div>
    </div>

    <div class="contact-card">
      <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
      <div class="contact-info">
        <h4>Head Office</h4>
        <p>123 Financial District, Lagos, Nigeria</p>
      </div>
    </div>

    <div class="contact-card">
      <div class="contact-icon"><i class="fa-regular fa-clock"></i></div>
      <div class="contact-info">
        <h4>Working Hours</h4>
        <p>Mon - Fri: 9:00 AM - 6:00 PM</p>
      </div>
    </div>
  </div>
