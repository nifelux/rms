<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0a0e27">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Premium Header */
    .auth-header-bar {
      background: linear-gradient(135deg, rgba(10,14,39,0.95), rgba(26,31,78,0.95));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,215,0,0.2);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ffd700, #e6c200);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0a0e27;
      box-shadow: 0 4px 12px rgba(255,215,0,0.3);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
      letter-spacing: 1px;
    }

    .brand-name span {
      color: #ff1a1a;
      font-size: 1.1rem;
    }

    .brand-tag {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-badge {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #ffd700;
      font-weight: 600;
    }

    /* Main Container */
    .auth-container {
      padding: 40px 20px 60px 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .auth-card {
      background: linear-gradient(135deg, rgba(17,22,58,0.8), rgba(26,32,80,0.8));
      border: 1px solid rgba(255,215,0,0.15);
      border-radius: 20px;
      padding: 32px 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-title h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
    }

    .auth-title p {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: #ffd700;
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
    }

    .form-control.error {
      border-color: #ff1a1a;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #ffd700;
    }

    /* Remember & Forgot Row */
    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ffd700;
      cursor: pointer;
    }

    .forgot-link {
      color: #ffd700;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #e6c200;
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #e6c200);
      color: #0a0e27;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(255,215,0,0.3);
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255,215,0,0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: linear-gradient(135deg, #555, #777);
      color: #aaa;
      box-shadow: none;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }

    .auth-footer a {
      color: #ffd700;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      color: #e6c200;
      text-decoration: underline;
    }

    /* Decorative Elements */
    .auth-container::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Premium Header -->
  <header class="auth-header-bar">
    <a href="/" class="brand">
      <div class="brand-mark">R</div>
      <div class="brand-copy">
        <div class="brand-name">RMS<span><i class="fa-solid fa-bolt"></i></span></div>
        <div class="brand-tag">Royal Management System</div>
      </div>
    </a>
    <div class="header-badge">
      <i class="fa-solid fa-shield-halved"></i> Secure
    </div>
  </header>

  <!-- Main Content -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-title">
        <h2>Welcome Back</h2>
        <p>Sign in to access your RMS dashboard</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            <i class="fa-solid fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4);"></i>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" style="padding-left: 42px;" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" onclick="togglePass('password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="remember-forgot">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>
          <a href="/forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    // 1. Password visibility toggle
    window.togglePass = (id, btn) => {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    };

    // 2. Load remembered email
    const rememberedEmail = localStorage.getItem('rms_remembered_email');
    if (rememberedEmail) {
      document.getElementById('email').value = rememberedEmail;
      document.getElementById('remember').checked = true;
    }

    // 3. Form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const btn = document.getElementById('submit-btn');

      // Validation
      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email address', 'error');
        return;
      }

      if (!password) {
        showToast('Please enter your password', 'error');
        return;
      }

      // Disable button and show loading
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        if (data.user) {
          // Save remembered email
          if (remember) {
            localStorage.setItem('rms_remembered_email', email);
          } else {
            localStorage.removeItem('rms_remembered_email');
          }

          showToast('Login successful! Redirecting...', 'success');

          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        }

      } catch (err) {
        console.error('Login error:', err);
        
        let message = 'Login failed. Please check your credentials.';
        if (err.message.includes('Invalid login credentials')) {
          message = 'Invalid email or password.';
        } else if (err.message.includes('Email not confirmed')) {
          message = 'Please verify your email address first.';
        } else if (err.message.includes('Too many requests')) {
          message = 'Too many attempts. Please try again later.';
        }
        
        showToast(message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
      }
    });

    // 4. Check if already logged in
    async function checkAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        window.location.href = '/dashboard.html';
      }
    }
    checkAuth();
  </script>
</body>
</html>
