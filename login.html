<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .auth-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: var(--rms-bg); }
    .auth-card { width: 100%; max-width: 400px; background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 20px; padding: 30px 24px; box-shadow: var(--rms-shadow); }
    .logo-center { text-align: center; font-size: 2.5rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--rms-text-muted); }
    .form-control { width: 100%; padding: 14px 14px 14px 42px; background: rgba(0,0,0,0.3); border: 1px solid var(--rms-border); border-radius: 12px; color: white; font-size: 1rem; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--rms-yellow); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--rms-text-muted); }
    .auth-footer a { color: var(--rms-yellow); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-center">RMS<span class="text-red"><i class="fa-solid fa-bolt"></i></span></div>
      <h3 style="text-align:center; margin-bottom: 24px;">Welcome Back</h3>
      
      <form id="login-form">
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i> Login
        </button>
      </form>
      
      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Logging in...';
      btn.disabled = true;

      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (error) {
        alert(error.message);
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
        btn.disabled = false;
      } else {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
