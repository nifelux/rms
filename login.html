<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoyalVest — Member Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    #page-content{visibility:hidden}
    .auth-wrap{max-width:420px;margin:3rem auto;padding:0 1.25rem 3rem;}
    .auth-hero-icon{
      width:56px;height:56px;border-radius:16px;background:var(--gradient-purple);color:#fff;
      display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem;
      box-shadow:0 10px 24px -10px rgba(76,52,176,0.5);
    }
    .auth-hero-icon svg{width:26px;height:26px}
    .auth-title{font-family:var(--font-display);font-weight:600;font-size:1.7rem;text-align:center;color:var(--clr-purple-ink);margin-bottom:0.3rem}
    .auth-subtitle{text-align:center;color:var(--clr-text-secondary);font-size:0.92rem;margin-bottom:1.75rem}
  </style>
  <meta name="theme-color" content="#071a3d">

<style data-royalvest-theme>
  :root {
    --rv-ink: #030a19;
    --rv-midnight: #071a3d;
    --rv-blue: #12376a;
    --rv-blue-soft: #1c4d83;
    --rv-gold: #e8ba4f;
    --rv-yellow: #f5d46e;
    --rv-green: #6fd55e;
    --rv-white: #f7f4eb;
    --rv-muted: #a7b8d3;
    --rv-line: rgba(232, 186, 79, .22);
    --rv-panel: rgba(10, 31, 70, .86);
    --rv-display: "Fraunces", Georgia, serif;
    --rv-body: "Inter", system-ui, sans-serif;
    --rv-shadow: 0 22px 70px rgba(0, 0, 0, .26);
  }

  html { background: var(--rv-ink) !important; scroll-behavior: smooth; }
  body.rv-shell {
    min-height: 100vh;
    color: var(--rv-white) !important;
    background:
      radial-gradient(circle at 84% 0%, rgba(23, 72, 136, .30), transparent 32rem),
      radial-gradient(circle at 8% 42%, rgba(111, 213, 94, .05), transparent 28rem),
      linear-gradient(135deg, var(--rv-ink) 0%, var(--rv-midnight) 56%, #0b2554 100%) !important;
    font-family: var(--rv-body) !important;
  }
  body.rv-shell::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(to bottom, black, transparent 78%);
    z-index: 0;
  }
  body.rv-shell > * { position: relative; z-index: 1; }
  body.rv-shell a { color: var(--rv-yellow); }
  body.rv-shell p, body.rv-shell li { color: var(--rv-muted); }
  body.rv-shell h1, body.rv-shell h2, body.rv-shell h3, body.rv-shell h4, body.rv-shell h5,
  body.rv-shell .mkt-heading, body.rv-shell .page-hero-mkt h1 { font-family: var(--rv-display) !important; color: var(--rv-white) !important; letter-spacing: -.02em; }
  body.rv-shell .mkt-eyebrow, body.rv-shell .eyebrow, body.rv-shell .section-label, body.rv-shell .page-hero-mkt .eyebrow { color: var(--rv-yellow) !important; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }

  body.rv-shell .floating-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(3, 10, 25, .88) !important;
    border-bottom: 1px solid var(--rv-line) !important;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
    backdrop-filter: blur(22px);
  }
  body.rv-shell .header-container { max-width: 1320px; min-height: 82px; padding: 0 1.4rem; }
  body.rv-shell .brand { gap: .7rem; text-decoration: none; }
  body.rv-shell .brand-mark {
    display: grid; place-items: center; width: 42px; height: 48px; border: 1px solid var(--rv-gold);
    border-radius: 48% 48% 45% 45% / 42% 42% 58% 58%; background: linear-gradient(155deg, rgba(232,186,79,.28), rgba(4,16,42,.95) 52%);
    color: var(--rv-yellow) !important; font-family: var(--rv-display) !important; font-size: 1.3rem; font-weight: 700;
    box-shadow: inset 0 0 0 3px rgba(232,186,79,.08), 0 8px 22px rgba(0,0,0,.22);
  }
  body.rv-shell .brand-name { color: var(--rv-white) !important; font-family: var(--rv-display) !important; font-size: 1.35rem; font-weight: 600; }
  body.rv-shell .brand-copy { display: grid; gap: .12rem; }
  body.rv-shell .brand-tag { color: var(--rv-yellow); font-size: .56rem; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
  body.rv-shell #main-nav { gap: .3rem; }
  body.rv-shell .nav-link { color: var(--rv-muted) !important; border-radius: 999px; transition: color .18s ease, background .18s ease, transform .18s ease; }
  body.rv-shell .nav-link:hover, body.rv-shell .nav-dropdown.open > .nav-link { color: var(--rv-white) !important; background: rgba(232,186,79,.10) !important; }
  body.rv-shell .dropdown-menu { background: #071a3d !important; border: 1px solid var(--rv-line) !important; box-shadow: var(--rv-shadow); }
  body.rv-shell .dropdown-menu a { color: var(--rv-muted) !important; }
  body.rv-shell .dropdown-menu a:hover { color: var(--rv-yellow) !important; background: rgba(232,186,79,.08) !important; }
  body.rv-shell .btn { border-radius: 999px !important; font-family: var(--rv-body) !important; font-weight: 700; letter-spacing: .02em; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
  body.rv-shell .btn:active { transform: scale(.97); }
  body.rv-shell .btn-primary, body.rv-shell .btn-success, body.rv-shell button[type="submit"] { background: linear-gradient(135deg, var(--rv-yellow), var(--rv-gold)) !important; border-color: var(--rv-yellow) !important; color: #081a38 !important; box-shadow: 0 10px 28px rgba(232,186,79,.18); }
  body.rv-shell .btn-primary:hover, body.rv-shell button[type="submit"]:hover { box-shadow: 0 14px 34px rgba(232,186,79,.28); transform: translateY(-1px); }
  body.rv-shell .btn-outline { color: var(--rv-yellow) !important; border: 1px solid rgba(232,186,79,.42) !important; background: rgba(7,26,61,.36) !important; }

  body.rv-shell .hero-mkt, body.rv-shell .page-hero-mkt, body.rv-shell .hero, body.rv-shell .dashboard-hero {
    position: relative; overflow: hidden; border-bottom: 1px solid var(--rv-line);
    background: linear-gradient(120deg, rgba(3,10,25,.97), rgba(7,26,61,.80) 68%, rgba(18,55,106,.54));
  }
  body.rv-shell .hero-mkt::after, body.rv-shell .page-hero-mkt::after, body.rv-shell .dashboard-hero::after {
    content: ""; position: absolute; right: 4%; bottom: -5rem; width: 18rem; height: 18rem; border: 1px solid rgba(232,186,79,.24); transform: rotate(45deg); box-shadow: 0 0 0 20px rgba(232,186,79,.035), 0 0 0 40px rgba(232,186,79,.02); pointer-events: none;
  }
  body.rv-shell .hero-mkt-inner, body.rv-shell .page-hero-mkt-inner { position: relative; z-index: 1; }
  body.rv-shell .hero-mkt h1 { max-width: 780px; font-size: clamp(2.5rem, 7vw, 5.8rem) !important; line-height: .98; }
  body.rv-shell .hero-mkt h1::first-line { color: var(--rv-white); }
  body.rv-shell .hero-mkt p, body.rv-shell .page-hero-mkt p { max-width: 650px; color: var(--rv-muted) !important; }
  body.rv-shell .hero-proof-dot { background: var(--rv-green) !important; box-shadow: 0 0 0 5px rgba(111,213,94,.10); }
  body.rv-shell .trust-strip { background: rgba(7,26,61,.78) !important; border-top: 1px solid var(--rv-line); border-bottom: 1px solid var(--rv-line); }
  body.rv-shell .trust-card { border-right: 1px solid rgba(232,186,79,.18) !important; }
  body.rv-shell .trust-number, body.rv-shell .tier-roi { color: var(--rv-yellow) !important; }
  body.rv-shell .trust-label { color: var(--rv-muted) !important; }
  body.rv-shell .mkt-section, body.rv-shell .card, body.rv-shell .quote-card, body.rv-shell .panel, body.rv-shell .form-card,
  body.rv-shell .auth-card, body.rv-shell .auth-shell-card, body.rv-shell .dashboard-card, body.rv-shell .stat-card,
  body.rv-shell .content-card, body.rv-shell .settings-card, body.rv-shell .profile-card {
    background: linear-gradient(155deg, rgba(12,38,82,.88), rgba(4,15,37,.92)) !important;
    border: 1px solid rgba(232,186,79,.18) !important; box-shadow: 0 14px 38px rgba(0,0,0,.16); border-radius: 18px;
  }
  body.rv-shell .mkt-section.is-tinted { background: rgba(12,38,82,.42) !important; }
  body.rv-shell .feature-row, body.rv-shell .step-row { border-color: rgba(232,186,79,.18) !important; }
  body.rv-shell .feature-mark, body.rv-shell .step-num { background: linear-gradient(145deg, var(--rv-gold), var(--rv-yellow)) !important; color: #071a3d !important; }
  body.rv-shell input, body.rv-shell select, body.rv-shell textarea { background: rgba(3,10,25,.72) !important; color: var(--rv-white) !important; border-color: rgba(232,186,79,.25) !important; }
  body.rv-shell input::placeholder, body.rv-shell textarea::placeholder { color: #7890b2 !important; }
  body.rv-shell label, body.rv-shell .form-label { color: var(--rv-muted) !important; }
  body.rv-shell .badge, body.rv-shell .status-badge, body.rv-shell .tier-ribbon { background: rgba(111,213,94,.14) !important; color: var(--rv-green) !important; border-color: rgba(111,213,94,.32) !important; }
  body.rv-shell .mkt-footer { margin-top: 3rem; background: #020814 !important; border-top: 1px solid var(--rv-line); }
  body.rv-shell .mkt-footer-bottom { color: #7890b2 !important; border-top-color: rgba(232,186,79,.14) !important; }
  body.rv-shell .cta-band { background: linear-gradient(135deg, rgba(18,55,106,.9), rgba(7,26,61,.92)) !important; border: 1px solid rgba(232,186,79,.32) !important; box-shadow: var(--rv-shadow); }
  body.rv-shell .mobile-menu { background: #04102a !important; border-left: 1px solid var(--rv-line); }
  body.rv-shell .mobile-menu-header { border-bottom-color: rgba(232,186,79,.18) !important; }
  body.rv-shell .mobile-link, body.rv-shell .mobile-accordion-toggle { color: var(--rv-muted) !important; }
  body.rv-shell .tab-bar { background: rgba(3,10,25,.94) !important; border-top: 1px solid var(--rv-line) !important; backdrop-filter: blur(18px); }
  body.rv-shell .tab-item { color: #8fa5c2 !important; }
  body.rv-shell .tab-item.is-active { color: var(--rv-yellow) !important; }
  body.rv-shell .rv-ambient-line { max-width: 1320px; height: 1px; margin: 0 auto; background: linear-gradient(90deg, transparent, var(--rv-gold), transparent); opacity: .65; }
  @media (max-width: 760px) {
    body.rv-shell .header-container { min-height: 72px; padding: 0 1rem; }
    body.rv-shell .brand-mark { width: 34px; height: 40px; }
    body.rv-shell .brand-name { font-size: 1.1rem; }
    body.rv-shell .brand-tag { font-size: .46rem; letter-spacing: .11em; }
    body.rv-shell .hero-mkt h1 { font-size: clamp(2.35rem, 14vw, 4rem) !important; }
    body.rv-shell .trust-strip { grid-template-columns: repeat(2, 1fr) !important; }
    body.rv-shell .trust-card { border-bottom: 1px solid rgba(232,186,79,.18) !important; }
  }
</style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>
<div class="rv-page-marker" aria-hidden="true">ROYALVEST / WHERE STOCKS MEETS INVESTMENTS</div>

  <div id="page-content">
    <div class="auth-wrap">
      <span class="auth-hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Log in to manage your investments.</p>

      <div id="error-alert" class="alert alert-danger" style="display:none;"></div>

      <form id="login-form" class="card form-card">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" required autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Login</button>
      </form>

      <p class="text-center mt-2">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://jytmnukzvxirnafukbck.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5dG1udWt6dnhpcm5hZnVrYmNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNjQ3MjUsImV4cCI6MjA5OTc0MDcyNX0.ZvGUPTW7dJ3UxL2N1TW0lBCe3H4559HaUEhks7vEbEw');
    window.supabase = supabase;

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-alert');
      const btn = document.getElementById('login-btn');
      errorDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
        return;
      }
      // Check admin status AND ban status — Supabase Auth has no concept
      // of our app's is_banned column, so a banned user authenticates
      // successfully every time; this is the only place that actually
      // enforces it at login.
      const { data: profile } = await supabase.from('profiles').select('is_admin, is_banned, ban_reason').eq('id', data.user.id).single();

      if (profile?.is_banned) {
        await supabase.auth.signOut();
        errorDiv.textContent = profile.ban_reason
          ? `Your account has been banned: ${profile.ban_reason}`
          : 'Your account has been banned. Contact support if you believe this is a mistake.';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
        return;
      }

      if (profile?.is_admin) {
        window.location.href = '/admin/index.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    });

    // Guest-only page — an already-logged-in visitor shouldn't see the
    // login form at all, send them straight to their dashboard.
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/dashboard.html';
        return;
      }

      // Shown when components.js force-logs-out an already-banned user
      // mid-session (see the ?banned=1 redirect there).
      const params = new URLSearchParams(location.search);
      if (params.get('banned') === '1') {
        const errorDiv = document.getElementById('error-alert');
        errorDiv.textContent = `Your account has been banned${decodeURIComponent(params.get('reason') || '.')}`;
        errorDiv.style.display = 'block';
      }

      document.getElementById('page-content').style.visibility = 'visible';
    })();
  </script>
  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
</body>
</html>
