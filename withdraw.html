<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Withdrawal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .withdraw-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .balance-display { text-align: center; padding: 20px; background: var(--rms-bg-card); border-radius: 16px; border: 1px solid var(--rms-border); margin-bottom: 20px; }
    .balance-display .lbl { color: var(--rms-text-muted); font-size: 0.9rem; }
    .balance-display .amt { font-size: 2.5rem; font-weight: 800; margin: 5px 0; }
    
    .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .amount-chip { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); color: var(--rms-white);
      padding: 12px 8px; border-radius: 10px; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .amount-chip:hover { border-color: var(--rms-yellow); }
    .amount-chip.active { background: var(--rms-vivid-red); border-color: var(--rms-vivid-red); color: white; }
    .amount-chip:disabled { opacity: 0.3; cursor: not-allowed; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 6px; }
    .form-control { 
      width: 100%; padding: 14px; background: var(--rms-bg-card); border: 1px solid var(--rms-border);
      border-radius: 10px; color: var(--rms-white); font-size: 1rem; box-sizing: border-box;
    }
    .form-control:focus { outline: none; border-color: var(--rms-yellow); }

    .rules-box { background: rgba(255,215,0,0.05); border: 1px solid var(--rms-yellow); border-radius: 12px; padding: 16px; margin-top: 24px; }
    .rules-box h4 { margin-top: 0; font-size: 1rem; color: var(--rms-yellow); display: flex; align-items: center; gap: 8px; }
    .schedule-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
    .schedule-row:last-child { border-bottom: none; }
    .rule-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--rms-bg-card); border: 1px solid var(--rms-border); padding: 8px 12px; border-radius: 20px; font-size: 0.8rem; margin: 4px; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="withdraw-container">
    <h2 style="margin-bottom: 5px;">Withdraw Funds</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Secure and fast payouts.</p>

    <div class="balance-display">
      <div class="lbl">Available Balance</div>
      <div class="amt">₦<span id="available-balance">0.00</span></div>
    </div>

    <div id="eligibility-alert" style="display:none; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;"></div>

    <h4 style="margin-bottom: 10px;">Select Amount</h4>
    <div class="amount-grid" id="amount-grid">
      <!-- Injected by JS -->
    </div>

    <form id="withdraw-form">
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> Account Name</label>
        <input type="text" id="account-name" class="form-control" placeholder="Enter account name" required>
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-hashtag"></i> Account Number</label>
        <input type="text" id="account-number" class="form-control" placeholder="10-digit number" required>
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-building-columns"></i> Bank Name</label>
        <input type="text" id="bank-name" class="form-control" placeholder="e.g. GTBank" required>
      </div>
      <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem; margin-top: 10px;">
        <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Submit Request
      </button>
    </form>

    <div class="rules-box">
      <h4><i class="fa-regular fa-calendar-check"></i> Weekly Schedule</h4>
      <div class="schedule-row"><span>M1, M2</span> <span class="text-yellow">Monday</span></div>
      <div class="schedule-row"><span>M3, M4</span> <span class="text-yellow">Tuesday</span></div>
      <div class="schedule-row"><span>M5</span> <span class="text-yellow">Wednesday</span></div>
      <div class="schedule-row"><span>M6</span> <span class="text-yellow">Thursday</span></div>
      <div class="schedule-row"><span>M7</span> <span class="text-yellow">Friday</span></div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <span class="rule-badge"><i class="fa-regular fa-clock text-yellow"></i> 10am - 6pm WAT</span>
      <span class="rule-badge"><i class="fa-solid fa-ban text-red"></i> No Weekends</span>
      <span class="rule-badge"><i class="fa-solid fa-1 text-yellow"></i> 1 per day</span>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    const amounts = [1800, 3000, 8000, 16000, 32000, 70000, 120000, 300000, 700000, 1000000, 2500000, 3000000];
    let selectedAmount = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';
      const token = (await supabase.auth.getSession()).data.session.access_token;

      // Load Balance
      const { data: wallet } = await supabase.from('wallets').select('balance').eq('user_id', user.id).single();
      const balance = wallet?.balance || 0;
      document.getElementById('available-balance').textContent = Number(balance).toLocaleString();

      // Check Eligibility
      const res = await fetch('/api/finance?action=getWithdrawalEligibility', { headers: { 'Authorization': `Bearer ${token}` } });
      const elig = await res.json();

      const alertBox = document.getElementById('eligibility-alert');
      if (!elig.can_withdraw_now) {
        alertBox.style.display = 'flex';
        alertBox.style.background = 'rgba(255,26,26,0.1)';
        alertBox.style.border = '1px solid var(--rms-vivid-red)';
        alertBox.style.color = 'var(--rms-vivid-red)';
        alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${elig.reason_blocked}`;
        document.getElementById('withdraw-form').style.opacity = '0.5';
        document.getElementById('withdraw-form').style.pointerEvents = 'none';
      } else {
        alertBox.style.display = 'flex';
        alertBox.style.background = 'rgba(46,204,113,0.1)';
        alertBox.style.border = '1px solid #2ecc71';
        alertBox.style.color = '#2ecc71';
        alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> You can withdraw today! (Tier: ${elig.tier})`;
      }

      // Render Amounts
      const grid = document.getElementById('amount-grid');
      amounts.forEach(amt => {
        const chip = document.createElement('div');
        chip.className = 'amount-chip';
        chip.textContent = '₦' + amt.toLocaleString();
        if (amt > balance) chip.disabled = true;
        chip.onclick = () => {
          if (chip.disabled) return;
          document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          selectedAmount = amt;
        };
        grid.appendChild(chip);
      });
    }

    document.getElementById('withdraw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedAmount) return alert('Please select a withdrawal amount.');
      
      const token = (await supabase.auth.getSession()).data.session.access_token;
      const res = await fetch('/api/finance?action=createWithdrawal', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          amount: selectedAmount,
          account_name: document.getElementById('account-name').value,
          account_number: document.getElementById('account-number').value,
          bank_name: document.getElementById('bank-name').value
        })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) window.location.href = '/dashboard.html';
    });

    init();
  </script>
</body>
</html>
