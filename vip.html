<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — VIP Tiers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .vip-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .tier-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); 
      border-radius: 16px; padding: 20px; margin-bottom: 16px; position: relative; overflow: hidden;
      transition: transform 0.2s;
    }
    .tier-card:hover { transform: translateY(-2px); }
    .tier-card.current { border-color: var(--rms-yellow); box-shadow: 0 0 15px rgba(255,215,0,0.1); }
    .tier-card.current::after { 
      content: 'CURRENT TIER'; position: absolute; top: 12px; right: -30px; 
      background: var(--rms-yellow); color: #0a0e27; font-size: 0.6rem; font-weight: 800; 
      padding: 4px 30px; transform: rotate(45deg);
    }
    .tier-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tier-name { font-size: 1.5rem; font-weight: 800; color: var(--rms-white); }
    .tier-price { font-size: 1.1rem; font-weight: 700; color: var(--rms-yellow); }
    
    .tier-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .tier-stat { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; text-align: center; }
    .tier-stat-val { font-size: 1.1rem; font-weight: 700; color: var(--rms-white); margin-bottom: 4px; }
    .tier-stat-lbl { font-size: 0.7rem; color: var(--rms-text-muted); text-transform: uppercase; }
    
    .withdrawal-day { 
      background: linear-gradient(90deg, rgba(255,26,26,0.1), transparent); 
      border-left: 3px solid var(--rms-vivid-red); padding: 10px 14px; border-radius: 0 8px 8px 0;
      font-size: 0.85rem; color: var(--rms-white); display: flex; align-items: center; gap: 8px;
    }
    
    .error-box { text-align: center; padding: 40px 20px; }
    .error-box i { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    .loading-box { text-align: center; padding: 40px 20px; color: var(--rms-text-muted); }
    .loading-box i { font-size: 2rem; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="vip-container">
    <h2 style="margin-bottom: 5px;">VIP Membership</h2>
    <p class="text-muted" style="margin-bottom: 24px;">Upgrade your tier to unlock higher earnings.</p>

    <div id="tiers-list">
      <div class="loading-box">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <p style="margin-top: 10px;">Loading tiers...</p>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    // ⚠️ REPLACE WITH YOUR ACTUAL KEYS ⚠️
    const supabase = createClient('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    async function loadTiers() {
      const list = document.getElementById('tiers-list');
      
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return window.location.href = '/login.html';

        // Fetch current user profile
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('vip_level')
          .eq('id', user.id)
          .single();

        if (profileError) {
          console.error('Profile fetch error:', profileError);
          throw new Error('Failed to load user profile');
        }

        // Fetch tiers from rms_tiers table
        const { data: tiers, error: tiersError } = await supabase
          .from('rms_tiers')
          .select('*')
          .order('upgrade_cost', { ascending: true });

        if (tiersError) {
          console.error('Tiers fetch error:', tiersError);
          throw new Error('Failed to load VIP tiers: ' + tiersError.message);
        }

        if (!tiers || tiers.length === 0) {
          list.innerHTML = `
            <div class="error-box">
              <i class="fa-solid fa-circle-exclamation"></i>
              <p>No VIP tiers configured yet.</p>
              <p style="font-size: 0.85rem; margin-top: 10px;">Please contact support.</p>
            </div>
          `;
          return;
        }

        list.innerHTML = tiers.map(t => {
          const isCurrent = t.tier === profile.vip_level;
          const withdrawalDay = days[t.withdrawal_day] || 'Unknown';
          
          return `
            <div class="tier-card ${isCurrent ? 'current' : ''}">
              <div class="tier-header">
                <div class="tier-name">${t.tier}</div>
                <div class="tier-price">₦${Number(t.upgrade_cost).toLocaleString()}</div>
              </div>
              <div class="tier-stats">
                <div class="tier-stat">
                  <div class="tier-stat-val">${t.daily_boxes}</div>
                  <div class="tier-stat-lbl">Daily Boxes</div>
                </div>
                <div class="tier-stat">
                  <div class="tier-stat-val text-yellow">₦${Number(t.box_earning).toLocaleString()}</div>
                  <div class="tier-stat-lbl">Per Box</div>
                </div>
              </div>
              <div class="withdrawal-day">
                <i class="fa-regular fa-calendar-check text-red"></i> 
                Withdrawal Day: <strong>${withdrawalDay}</strong>
              </div>
              ${isCurrent ? '<div style="margin-top: 12px; padding: 8px; background: rgba(46,204,113,0.1); border-radius: 8px; text-align: center; color: #2ecc71; font-size: 0.85rem; font-weight: 600;">✅ Your Current Tier</div>' : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('VIP loading error:', err);
        list.innerHTML = `
          <div class="error-box">
            <i class="fa-solid fa-triangle-exclamation" style="color: var(--rms-vivid-red);"></i>
            <p style="color: var(--rms-vivid-red);">Error: ${err.message}</p>
            <button onclick="loadTiers()" class="rms-btn rms-btn-outline" style="margin-top: 10px;">Retry</button>
          </div>
        `;
      }
    }

    loadTiers();
  </script>
</body>
</html>
