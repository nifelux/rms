<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — VIP Upgrade</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .vip-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; font-family: 'Inter', sans-serif; }
    
    .current-tier-card {
      background: linear-gradient(135deg, #666 0%, #999 100%);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .current-tier-card::before {
      content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); pointer-events: none;
    }
    .current-tier-label { font-size: 0.85rem; color: rgba(255,255,255,0.8); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; position: relative; z-index: 1; }
    .current-tier-name { font-size: 2rem; font-weight: 900; color: white; margin-bottom: 12px; position: relative; z-index: 1; }
    .current-tier-benefits { font-size: 0.85rem; color: rgba(255,255,255,0.9); position: relative; z-index: 1; }
    
    .section-title { font-size: 1.2rem; font-weight: 800; margin: 28px 0 16px 0; color: white; display: flex; align-items: center; gap: 10px; }
    .section-title i { color: #ffd700; }
    
    .tier-card {
      background: linear-gradient(135deg, rgba(0,102,255,0.1), rgba(0,212,255,0.05));
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .tier-card:hover { border-color: #ffd700; transform: translateY(-2px); }
    .tier-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #0066ff, #00d4ff, #0066ff); }
    .tier-card.current { border-color: #00ff88; background: linear-gradient(135deg, rgba(0,210,106,0.1), rgba(0,255,136,0.05)); }
    .tier-card.current::before { background: linear-gradient(90deg, #00d26a, #00ff88, #00d26a); }
    .tier-card.passed { opacity: 0.7; border-color: rgba(255,255,255,0.1); }
    .tier-card.passed::before { background: linear-gradient(90deg, #666, #999, #666); }
    
    .tier-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tier-name { font-size: 1.4rem; font-weight: 900; color: white; }
    .tier-price { font-size: 1.3rem; font-weight: 900; color: #ffd700; }
    
    .tier-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .tier-stat { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center; }
    .tier-stat-val { font-size: 1rem; font-weight: 800; color: #00d4ff; margin-bottom: 4px; }
    .tier-stat-lbl { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; font-weight: 600; }
    
    .tier-benefits { margin-bottom: 18px; }
    .tier-benefit { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.9rem; color: rgba(255,255,255,0.9); }
    .tier-benefit i { color: #00ff88; font-size: 0.9rem; }
    
    .upgrade-btn {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 800; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #e6c200); color: #0a0e27; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 8px 24px rgba(255,215,0,0.3);
    }
    .upgrade-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,215,0,0.4); }
    .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #555; color: #aaa; box-shadow: none; }
    .upgrade-btn.current-tier { background: linear-gradient(135deg, #00d26a, #00ff88); color: white; }
    .upgrade-btn.passed-tier { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); box-shadow: none; }
    
    .m0-notice { background: linear-gradient(135deg, rgba(255,26,26,0.1), rgba(255,68,68,0.05)); border: 1px solid rgba(255,26,26,0.3); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .m0-notice h3 { color: #ff4444; margin: 0 0 12px 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .m0-notice ul { margin: 0; padding-left: 20px; color: rgba(255,255,255,0.8); font-size: 0.9rem; line-height: 1.8; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="vip-container">
    <h2 style="margin-bottom: 5px; font-size: 1.8rem; font-weight: 900; color: white;">VIP Membership</h2>
    <p style="color: rgba(255,255,255,0.6); margin-bottom: 24px; font-size: 0.95rem;">Upgrade your tier to unlock daily earnings.</p>

    <div class="current-tier-card">
      <div class="current-tier-label">Your Current Tier</div>
      <div class="current-tier-name" id="current-tier">M0</div>
      <div class="current-tier-benefits" id="current-benefits">Loading...</div>
    </div>

    <div class="m0-notice" id="m0-notice" style="display: none;">
      <h3><i class="fa-solid fa-exclamation-triangle"></i> M0 Limitations</h3>
      <ul>
        <li>Only 3 starter tasks (₦50 each)</li>
        <li><strong>No withdrawals allowed</strong></li>
        <li>Wealth Center locked</li>
      </ul>
    </div>

    <div class="section-title"><i class="fa-solid fa-crown"></i> Available Tiers</div>
    <div id="tier-list">
      <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem;"></i>
        <p>Loading tiers...</p>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    const tierOrder = ['M0', 'M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'];

    // Updated benefits matching the new database prices
    const tierBenefits = {
      'M1': [
        { text: '5 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦612 Daily', unlocked: true },
        { text: 'Total Return: ₦223,380', unlocked: true },
        { text: 'Withdrawal Day: Monday', unlocked: true },
        { text: 'Wealth Center access', unlocked: true }
      ],
      'M2': [
        { text: '10 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦1,326 Daily', unlocked: true },
        { text: 'Total Return: ₦483,990', unlocked: true },
        { text: 'Withdrawal Day: Monday', unlocked: true },
        { text: 'Priority support', unlocked: true }
      ],
      'M3': [
        { text: '15 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦3,264 Daily', unlocked: true },
        { text: 'Total Return: ₦1,191,360', unlocked: true },
        { text: 'Withdrawal Day: Tuesday', unlocked: true },
        { text: 'VIP support channel', unlocked: true }
      ],
      'M4': [
        { text: '20 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦7,140 Daily', unlocked: true },
        { text: 'Total Return: ₦2,606,100', unlocked: true },
        { text: 'Withdrawal Day: Tuesday', unlocked: true },
        { text: 'Personal account manager', unlocked: true }
      ],
      'M5': [
        { text: '25 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦13,260 Daily', unlocked: true },
        { text: 'Total Return: ₦4,839,900', unlocked: true },
        { text: 'Withdrawal Day: Wednesday', unlocked: true },
        { text: 'Dedicated VIP support', unlocked: true }
      ],
      'M6': [
        { text: '30 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦26,112 Daily', unlocked: true },
        { text: 'Total Return: ₦9,530,880', unlocked: true },
        { text: 'Withdrawal Day: Thursday', unlocked: true },
        { text: 'VIP-only bonuses', unlocked: true }
      ],
      'M7': [
        { text: '35 Daily Mystery Boxes', unlocked: true },
        { text: 'Earn ₦51,204 Daily', unlocked: true },
        { text: 'Total Return: 18,689,460', unlocked: true },
        { text: 'Withdrawal Day: Friday', unlocked: true },
        { text: 'Lifetime premium access', unlocked: true }
      ]
    };

    async function loadVIPPage() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      try {
        const { data: profile } = await supabase.from('profiles').select('vip_level').eq('id', user.id).single();
        const currentTier = profile?.vip_level || 'newbie';
        const displayTier = currentTier === 'newbie' ? 'M0' : currentTier;
        const currentTierIndex = tierOrder.indexOf(displayTier);
        
        document.getElementById('current-tier').textContent = displayTier;
        
        const isM0 = currentTier === 'newbie' || currentTier === 'M0';
        if (isM0) {
          document.getElementById('m0-notice').style.display = 'block';
          document.getElementById('current-benefits').textContent = 'Starter tier with limited access';
        } else {
          document.getElementById('current-benefits').textContent = `${tierBenefits[displayTier]?.length || 0} premium benefits unlocked`;
        }

        const { data: tiers } = await supabase.from('rms_tiers').select('*').order('upgrade_cost', { ascending: true });
        const tierListEl = document.getElementById('tier-list');
        
        if (tiers && tiers.length > 0) {
          tierListEl.innerHTML = tiers.map(tier => {
            const tierIndex = tierOrder.indexOf(tier.tier);
            const isCurrent = tier.tier === displayTier;
            const isPassed = tierIndex < currentTierIndex;
            const benefits = tierBenefits[tier.tier] || [];
            
            let btnHtml = '';
            if (isCurrent) {
              btnHtml = `<button class="upgrade-btn current-tier" disabled><i class="fa-solid fa-check"></i> Current Tier</button>`;
            } else if (isPassed) {
              btnHtml = `<button class="upgrade-btn passed-tier" disabled><i class="fa-solid fa-check-circle"></i> Passed</button>`;
            } else {
              btnHtml = `<button class="upgrade-btn" onclick="upgradeToTier('${tier.tier}', ${tier.upgrade_cost})"><i class="fa-solid fa-crown"></i> Upgrade Now (₦${Number(tier.upgrade_cost).toLocaleString()})</button>`;
            }
            
            return `
              <div class="tier-card ${isCurrent ? 'current' : ''} ${isPassed ? 'passed' : ''}">
                <div class="tier-header">
                  <div class="tier-name">${tier.tier}</div>
                  <div class="tier-price">₦${Number(tier.upgrade_cost).toLocaleString()}</div>
                </div>
                <div class="tier-stats">
                  <div class="tier-stat">
                    <div class="tier-stat-val">${tier.daily_boxes}</div>
                    <div class="tier-stat-lbl">Daily Boxes</div>
                  </div>
                  <div class="tier-stat">
                    <div class="tier-stat-val">${Number(tier.daily_earning).toLocaleString()}</div>
                    <div class="tier-stat-lbl">Daily Earning</div>
                  </div>
                </div>
                <div class="tier-benefits">
                  ${benefits.map(b => `
                    <div class="tier-benefit">
                      <i class="fa-solid fa-check-circle"></i>
                      ${b.text}
                    </div>
                  `).join('')}
                </div>
                ${btnHtml}
              </div>
            `;
          }).join('');
        } else {
          tierListEl.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">No tiers available</div>';
        }

      } catch (err) {
        console.error('VIP page error:', err);
        showToast('Failed to load VIP data', 'error');
      }
    }

    window.upgradeToTier = async (targetTier, cost) => {
      showConfirm(`Upgrade to ${targetTier} for ₦${Number(cost).toLocaleString()}? This will be deducted from your wallet.`, async () => {
        try {
          const token = (await supabase.auth.getSession()).data.session.access_token;
          const res = await fetch('/api/admin?action=upgradeTier', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ target_tier: targetTier })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Upgrade failed');
          showToast(` Successfully upgraded to ${targetTier}!`, 'success');
          setTimeout(() => loadVIPPage(), 1500);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    };

    loadVIPPage();
  </script>
</body>
</html>
