<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMS — VIP Tiers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .vip-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .balance-card {
      background: linear-gradient(135deg, var(--rms-bg-card), #1a2050);
      border: 1px solid var(--rms-yellow);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .balance-amount { font-size: 2rem; font-weight: 800; color: var(--rms-yellow); }
    .tier-card { 
      background: var(--rms-bg-card); 
      border: 2px solid var(--rms-border); 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 20px; 
    }
    .tier-card.current { border-color: var(--rms-yellow); }
    .tier-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .tier-name { font-size: 1.8rem; font-weight: 800; }
    .tier-price { font-size: 1.3rem; font-weight: 700; color: var(--rms-yellow); }
    .tier-benefits { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .benefit-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .benefit-row:last-child { border-bottom: none; }
    .benefit-label { color: var(--rms-text-muted); }
    .benefit-value { font-weight: 700; color: var(--rms-yellow); }
    .withdrawal-day { 
      background: linear-gradient(90deg, rgba(255,26,26,0.15), transparent); 
      border-left: 3px solid var(--rms-vivid-red); 
      padding: 10px 14px; 
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
    }
    .upgrade-btn { 
      width: 100%; 
      padding: 14px; 
      font-size: 1rem; 
      font-weight: 700;
      border: none; 
      border-radius: 12px; 
      cursor: pointer;
    }
    .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .upgrade-btn.current { background: rgba(46,204,113,0.2); color: #2ecc71; }
    .upgrade-btn.upgrade { background: linear-gradient(135deg, var(--rms-yellow), #e6c200); color: #0a0e27; }
    .debug-box { 
      background: rgba(255,0,0,0.1); 
      border: 1px solid red; 
      border-radius: 8px; 
      padding: 16px; 
      margin-bottom: 20px; 
      font-family: monospace; 
      font-size: 0.75rem; 
      color: #ff6b6b; 
      white-space: pre-wrap;
    }
    .loading-box { text-align: center; padding: 40px; color: var(--rms-text-muted); }
    .error-box { 
      background: rgba(255,26,26,0.1); 
      border: 1px solid var(--rms-vivid-red); 
      border-radius: 12px; 
      padding: 20px; 
      text-align: center;
    }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="vip-container">
    <h2 style="margin-bottom: 5px;">VIP Membership</h2>
    <p class="text-muted" style="margin-bottom: 24px;">Upgrade to unlock higher earnings and benefits.</p>

    <div class="balance-card">
      <div style="font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px;">Available Balance</div>
      <div class="balance-amount">₦<span id="wallet-balance">0</span></div>
    </div>

    <div id="debug-container"></div>
    <div id="tiers-list">
      <div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading...</p></div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');
    window.supabase = supabase;

    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const debugDiv = document.getElementById('debug-container');

    async function loadVIPPage() {
      const debug = [];
      
      try {
        debug.push('🔍 Starting VIP page load...');
        
        // Check auth
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        debug.push(`Auth: ${session ? '✅ Logged in' : '❌ Not logged in'}`);
        
        if (!session) {
          window.location.href = '/login.html';
          return;
        }

        // Get wallet
        const { data: wallet, error: walletError } = await supabase
          .from('wallets')
          .select('balance')
          .eq('user_id', session.user.id)
          .single();

        debug.push(`Wallet: ${walletError ? '❌ ' + walletError.message : '✅ ₦' + wallet.balance}`);
        document.getElementById('wallet-balance').textContent = wallet ? Number(wallet.balance).toLocaleString() : '0';

        // Get profile
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('vip_level')
          .eq('id', session.user.id)
          .single();

        debug.push(`Profile: ${profileError ? '❌ ' + profileError.message : '✅ ' + profile.vip_level}`);

        // Fetch tiers
        debug.push('📊 Fetching rms_tiers table...');
        const { data: tiers, error: tiersError } = await supabase
          .from('rms_tiers')
          .select('*')
          .order('upgrade_cost', { ascending: true });

        debug.push(`Tiers Query: ${tiersError ? ' ' + tiersError.message : '✅ Found ' + (tiers?.length || 0) + ' tiers'}`);
        
        if (tiersError) {
          debug.push(`Error details: ${JSON.stringify(tiersError, null, 2)}`);
        }

        if (tiers && tiers.length > 0) {
          debug.push(`Tier data: ${JSON.stringify(tiers[0], null, 2)}`);
        }

        const list = document.getElementById('tiers-list');

        if (!tiers || tiers.length === 0) {
          debug.push('⚠️ No tiers found - showing error');
          list.innerHTML = `
            <div class="error-box">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; color: var(--rms-vivid-red); margin-bottom: 10px;"></i>
              <p style="color: var(--rms-vivid-red);">No VIP tiers configured</p>
              <p style="font-size: 0.85rem;">Check debug info above</p>
            </div>
          `;
        } else {
          debug.push('✅ Rendering tiers...');
          list.innerHTML = tiers.map(tier => {
            const isCurrent = tier.tier === profile.vip_level;
            const canAfford = Number(wallet.balance) >= Number(tier.upgrade_cost);
            
            return `
              <div class="tier-card ${isCurrent ? 'current' : ''}">
                <div class="tier-header">
                  <div class="tier-name">${tier.tier}</div>
                  <div class="tier-price">₦${Number(tier.upgrade_cost).toLocaleString()}</div>
                </div>
                <div class="tier-benefits">
                  <div class="benefit-row">
                    <span class="benefit-label">Daily Boxes</span>
                    <span class="benefit-value">${tier.daily_boxes}/day</span>
                  </div>
                  <div class="benefit-row">
                    <span class="benefit-label">Per Box</span>
                    <span class="benefit-value">₦${Number(tier.box_earning).toLocaleString()}</span>
                  </div>
                  <div class="benefit-row">
                    <span class="benefit-label">Daily Income</span>
                    <span class="benefit-value">₦${(tier.daily_boxes * tier.box_earning).toLocaleString()}</span>
                  </div>
                </div>
                <div class="withdrawal-day">
                  <i class="fa-regular fa-calendar-check"></i> Withdrawal: <strong>${days[tier.withdrawal_day]}</strong>
                </div>
                ${isCurrent ? `
                  <button class="upgrade-btn current" disabled>
                    <i class="fa-solid fa-check-circle"></i> Your Current Tier
                  </button>
                ` : `
                  <button 
                    class="upgrade-btn upgrade" 
                    onclick="upgradeToTier('${tier.tier}', ${tier.upgrade_cost})"
                    ${!canAfford ? 'disabled' : ''}
                  >
                    ${canAfford ? 'Upgrade to ' + tier.tier : 'Insufficient Balance'}
                  </button>
                `}
              </div>
            `;
          }).join('');
        }

        debugDiv.innerHTML = `<div class="debug-box">${debug.join('\n')}</div>`;

      } catch (err) {
        debug.push(`💥 Fatal error: ${err.message}`);
        debugDiv.innerHTML = `<div class="debug-box">${debug.join('\n')}</div>`;
        console.error('VIP Error:', err);
      }
    }

    window.upgradeToTier = async (tierName, cost) => {
      if (!confirm(`Upgrade to ${tierName} for ₦${Number(cost).toLocaleString()}?`)) return;
      
      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/admin?action=upgradeTier', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ target_tier: tierName })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upgrade failed');
        
        alert('✅ Successfully upgraded to ' + tierName + '!');
        loadVIPPage();
      } catch (err) {
        alert('❌ ' + err.message);
      }
    };

    loadVIPPage();
  </script>
</body>
</html>
