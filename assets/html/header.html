<header class="floating-header">
  <div class="header-container">
    <a href="/index.html" class="brand" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
      <div class="brand-mark">R</div>
      <div class="brand-copy">
        <div class="brand-name">RMS<span style="color: var(--rms-vivid-red); font-size: 0.9em;"><i class="fa-solid fa-bolt"></i></span></div>
        <div class="brand-tag">Royal Management System</div>
      </div>
    </a>
    
    <!-- Desktop Nav (Hidden on mobile via CSS in style.css) -->
    <nav id="main-nav" style="display: none;"> 
      <!-- Add desktop links here if needed later -->
    </nav>

    <!-- Mobile Menu Toggle -->
    <button id="mobile-menu-toggle" style="background:none; border:none; color:white; font-size:1.4rem; cursor:pointer;">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>

<!-- Mobile Slide-out Menu -->
<div class="mobile-menu" id="mobile-menu" style="transform: translateX(100%); transition: transform 0.3s ease;">
  <div class="mobile-menu-header">
    <div class="brand-name" style="font-size: 1.2rem;">Menu</div>
    <button id="close-mobile-menu" style="background:none; border:none; color:white; font-size:1.4rem; cursor:pointer;">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
    <a href="/dashboard.html" class="mobile-link" style="color: white; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-house" style="width: 24px; color: var(--rms-yellow);"></i> Dashboard
    </a>
    <a href="/investments.html" class="mobile-link" style="color: white; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-box-open" style="width: 24px; color: var(--rms-yellow);"></i> Mystery Boxes
    </a>
    <a href="/wealth-center.html" class="mobile-link" style="color: white; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-gem" style="width: 24px; color: var(--rms-yellow);"></i> Wealth Center
    </a>
    <a href="/team.html" class="mobile-link" style="color: white; text-decoration: none; font-size: 1.1rem; display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-users" style="width: 24px; color: var(--rms-yellow);"></i> My Team
    </a>
    <hr style="border-color: var(--rms-border); opacity: 0.5;">
    <a href="/login.html" class="mobile-link" style="color: var(--rms-text-muted); text-decoration: none; font-size: 1rem; display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-right-to-bracket" style="width: 24px;"></i> Login
    </a>
    <a href="/register.html" class="mobile-link" style="color: var(--rms-text-muted); text-decoration: none; font-size: 1rem; display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-user-plus" style="width: 24px;"></i> Register
    </a>
  </div>
</div>

<script>
  // Simple toggle logic for mobile menu
  document.getElementById('mobile-menu-toggle')?.addEventListener('click', () => {
    document.getElementById('mobile-menu').style.transform = 'translateX(0)';
  });
  document.getElementById('close-mobile-menu')?.addEventListener('click', () => {
    document.getElementById('mobile-menu').style.transform = 'translateX(100%)';
  });
</script>
