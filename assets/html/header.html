<header class="floating-header">
  <div class="header-container">
    <a href="/index.html" class="brand" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
      <div class="brand-mark">R</div>
      <div class="brand-copy">
        <div class="brand-name">RMS<span style="color: var(--rms-vivid-red); font-size: 0.9em;"><i class="fa-solid fa-bolt"></i></span></div>
        <div class="brand-tag">Royal Management System</div>
      </div>
    </a>
    
    <!-- VIP Level Indicator -->
    <a href="/vip.html" id="vip-indicator" class="vip-indicator" style="display:none;">
      <i class="fa-solid fa-crown" style="margin-right: 6px;"></i>
      <span id="vip-level-text">M0</span>
    </a>
  </div>
</header>

<style>
  .vip-indicator {
    display: flex !important;
    align-items: center;
    background: linear-gradient(135deg, var(--rms-yellow), #e6c200);
    color: #0a0e27;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(255,215,0,0.3);
  }
  .vip-indicator:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(255,215,0,0.4);
  }
  .vip-indicator .fa-crown {
    font-size: 0.9rem;
  }
  .vip-indicator.m0 { background: linear-gradient(135deg, #95a5a6, #7f8c8d); color: white; box-shadow: 0 2px 8px rgba(149,165,166,0.3); }
  .vip-indicator.m1 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: white; box-shadow: 0 2px 8px rgba(205,127,50,0.3); }
  .vip-indicator.m2 { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: #0a0e27; box-shadow: 0 2px 8px rgba(192,192,192,0.3); }
  .vip-indicator.m3 { background: linear-gradient(135deg, var(--rms-yellow), #e6c200); color: #0a0e27; }
  .vip-indicator.m4 { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; box-shadow: 0 2px 8px rgba(46,204,113,0.3); }
  .vip-indicator.m5 { background: linear-gradient(135deg, #3498db, #2980b9); color: white; box-shadow: 0 2px 8px rgba(52,152,219,0.3); }
  .vip-indicator.m6 { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; box-shadow: 0 2px 8px rgba(155,89,182,0.3); }
  .vip-indicator.m7 { background: linear-gradient(135deg, var(--rms-vivid-red), #c0392b); color: white; box-shadow: 0 2px 8px rgba(255,26,26,0.3); }
</style>

<script>
  async function loadVipIndicator() {
    try {
      if (!window.supabase) return;
      
      const { data: { user } } = await window.supabase.auth.getUser();
      if (!user) return;
      
      const { data: profile } = await window.supabase
        .from('profiles')
        .select('vip_level')
        .eq('id', user.id)
        .single();
      
      if (profile && profile.vip_level) {
        const levelText = document.getElementById('vip-level-text');
        const indicator = document.getElementById('vip-indicator');
        
        if (levelText) levelText.textContent = profile.vip_level.toUpperCase();
        if (indicator) {
          indicator.style.display = 'flex';
          indicator.className = 'vip-indicator ' + profile.vip_level.toLowerCase();
        }
      }
    } catch (err) {
      console.error('VIP indicator error:', err);
    }
  }
  
  // Wait for supabase to be ready
  const checkSupabase = setInterval(() => {
    if (window.supabase) {
      clearInterval(checkSupabase);
      loadVipIndicator();
    }
  }, 100);
  
  // Fallback after 3 seconds
  setTimeout(() => {
    clearInterval(checkSupabase);
    if (window.supabase) loadVipIndicator();
  }, 3000);
</script>
