<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Daily Mystery Boxes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 100%);
      min-height: 100vh;
      color: white;
      padding-bottom: 100px;
    }

    .task-container { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    
    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 2rem; font-weight: 900; color: white; margin: 0 0 8px 0; }
    .page-header p { color: rgba(255,255,255,0.6); font-size: 0.95rem; margin: 0; }

    .tier-badge {
      display: inline-block;
      background: rgba(0,212,255,0.15);
      color: #00d4ff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 20px;
      border: 1px solid rgba(0,212,255,0.3);
    }

    .progress-section { margin-bottom: 28px; }
    .progress-label { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .progress-label span:first-child { color: rgba(255,255,255,0.7); }
    .progress-label span:last-child { color: #00d4ff; font-weight: 800; }
    
    .progress-bar-bg { 
      width: 100%; 
      height: 8px; 
      background: rgba(255,255,255,0.1); 
      border-radius: 4px; 
      overflow: hidden; 
    }
    .progress-bar-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #00d4ff, #0066ff); 
      border-radius: 4px; 
      transition: width 0.5s ease; 
    }

    .m0-notice {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
      color: #ffd700;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .box-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 16px; 
    }

    .mystery-box {
      aspect-ratio: 1;
      background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(0,102,255,0.05));
      border: 2px solid rgba(0,212,255,0.3);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: visible;
    }

    .mystery-box:hover:not(.opened):not(.opening) { 
      transform: scale(1.05); 
      border-color: #00d4ff; 
      box-shadow: 0 0 30px rgba(0,212,255,0.4); 
    }
    
    .mystery-box.opened { 
      border-color: rgba(0,255,136,0.4); 
      background: rgba(0,255,136,0.1);
      cursor: default; 
    }
    
    .mystery-box.opening { 
      animation: boxShake 0.5s ease; 
    }

    .box-icon { 
      font-size: 3rem; 
      color: #00d4ff;
      margin-bottom: 8px; 
      transition: all 0.3s ease; 
      position: relative; 
      z-index: 2; 
    }
    
    .mystery-box:hover:not(.opened):not(.opening) .box-icon { 
      transform: rotate(-10deg) scale(1.1); 
    }
    
    .mystery-box.opening .box-icon { 
      animation: boxLidFly 0.6s ease forwards; 
    }

    .box-label { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: rgba(255,255,255,0.8);
      position: relative; 
      z-index: 2; 
    }

    .box-reward {
      position: absolute; 
      inset: 0; 
      background: rgba(10,14,39,0.98);
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 1.3rem; 
      font-weight: 900; 
      color: #00ff88;
      opacity: 0; 
      transition: opacity 0.3s; 
      z-index: 3;
      border-radius: 18px;
    }
    
    .mystery-box.opened .box-reward { 
      opacity: 1; 
    }
    
    .mystery-box.opened .box-icon, 
    .mystery-box.opened .box-label { 
      display: none; 
    }

    .sparkle {
      position: fixed; 
      border-radius: 50%; 
      pointer-events: none; 
      z-index: 999999;
      box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
    }

    .notification {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0,255,136,0.15);
      border: 2px solid #00ff88;
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: #00ff88;
      opacity: 0;
      pointer-events: none;
      z-index: 10000;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,255,136,0.3);
    }
    
    .notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .state-box { 
      text-align: center; 
      padding: 60px 20px; 
      grid-column: 1 / -1; 
    }
    
    .loading-box { 
      text-align: center; 
      padding: 60px; 
      color: rgba(255,255,255,0.5); 
      grid-column: 1 / -1;
    }

    @keyframes boxShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    
    @keyframes boxLidFly {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(-50px) rotate(-30deg); opacity: 0; }
    }
    
    @keyframes sparkleBurst {
      0% { transform: translate(0, 0) scale(0); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }
    
    @keyframes rewardReveal {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    
    .reward-amount { 
      animation: rewardReveal 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; 
      text-shadow: 0 0 20px #00ff88; 
    }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="task-container">
    <div class="page-header">
      <h2>Daily Mystery Boxes</h2>
      <p>Tap a box to reveal your reward.</p>
    </div>

    <div class="tier-badge" id="tier-badge">Loading...</div>

    <div id="m0-notice" class="m0-notice" style="display: none;">
      <i class="fa-solid fa-gift"></i> M0: 1 task per day for 3 days
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>Daily Progress</span>
        <span id="progress-text">0 / 0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <div class="box-grid" id="box-grid">
      <div class="loading-box">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: #00d4ff; margin-bottom: 16px;"></i>
        <p>Loading boxes...</p>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  
  <div class="notification" id="notification">
    <i class="fa-solid fa-check-circle" style="font-size: 1.5rem;"></i>
    <span id="notification-text">You earned 0!</span>
  </div>

  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    let taskStatus = null;

    async function loadTasks() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      const grid = document.getElementById('box-grid');
      
      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/task?action=getTaskStatus', { 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `Failed to load tasks (Status: ${res.status})`);
        }
        
        taskStatus = await res.json();
        
        // Handle Weekend
        if (taskStatus.weekend_closed) {
          document.getElementById('tier-badge').textContent = 'Weekend Break';
          grid.innerHTML = `<div class="state-box"><i class="fa-solid fa-calendar-xmark" style="font-size: 3rem; color: #ff4444; margin-bottom: 16px;"></i><p style="color: rgba(255,255,255,0.8);">${taskStatus.message}</p></div>`;
          updateProgress(0, 0);
          return;
        }

        // Handle M0 Expired / Completed
        if (taskStatus.m0_expired || (taskStatus.tier === 'M0' && taskStatus.max_boxes === 0)) {
          document.getElementById('tier-badge').textContent = 'Tier: M0';
          grid.innerHTML = `
            <div class="state-box">
              <i class="fa-solid fa-trophy" style="font-size: 3rem; color: #00ff88; margin-bottom: 16px;"></i>
              <h3 style="color: white; margin-bottom: 8px;">All M0 Tasks Completed!</h3>
              <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px;">You earned ₦150 total</p>
              <a href="/vip.html" style="display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #00d4ff, #0066ff); color: white; text-decoration: none; border-radius: 12px; font-weight: 800;">
                <i class="fa-solid fa-crown"></i> Upgrade to M1
              </a>
            </div>
          `;
          updateProgress(3, 3);
          return;
        }

        // Set Tier Badge & M0 Notice
        document.getElementById('tier-badge').textContent = `Tier: ${taskStatus.tier.toUpperCase()}`;
        if (taskStatus.tier === 'M0' || taskStatus.tier === 'NEWBIE') {
          document.getElementById('m0-notice').style.display = 'block';
        }

        // Use correct field names from API response
        const boxesOpened = taskStatus.boxes_opened || 0;
        const maxBoxes = taskStatus.max_boxes || 0;
        
        updateProgress(boxesOpened, maxBoxes);
        renderBoxes();

      } catch (err) {
        console.error('Load error:', err);
        grid.innerHTML = `
          <div class="state-box">
            <i class="fa-solid fa-triangle-exclamation" style="color: #ff4444; font-size: 3rem; margin-bottom: 16px;"></i>
            <p style="color: #ff4444; font-weight: 700;">${err.message}</p>
            <button onclick="loadTasks()" style="margin-top: 16px; padding: 12px 32px; background: rgba(0,212,255,0.2); border: 1px solid rgba(0,212,255,0.4); color: #00d4ff; border-radius: 12px; cursor: pointer; font-weight: 700;">
              <i class="fa-solid fa-rotate-right"></i> Retry
            </button>
          </div>
        `;
      }
    }

    function updateProgress(opened, max) {
      const displayMax = max === 0 ? (taskStatus?.tier === 'M0' ? 1 : 0) : max;
      document.getElementById('progress-text').textContent = `${opened} / ${displayMax}`;
      const percent = displayMax > 0 ? (opened / displayMax) * 100 : 0;
      document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function renderBoxes() {
      const grid = document.getElementById('box-grid');
      grid.innerHTML = '';
      
      const max = taskStatus.max_boxes || 0;
      const opened = taskStatus.boxes_opened || 0;
      const earning = taskStatus.earning_per_box || 0;
      
      // M0 gets 1 big box, M1+ gets a grid
      if (taskStatus.tier === 'M0' || taskStatus.tier === 'NEWBIE') {
        grid.style.gridTemplateColumns = '1fr';
        const box = document.createElement('div');
        box.className = `mystery-box ${opened >= 1 ? 'opened' : ''}`;
        box.style.maxWidth = '200px';
        box.style.margin = '0 auto';
        box.innerHTML = `
          <i class="fa-solid ${opened >= 1 ? 'fa-check-circle' : 'fa-gift'} box-icon" style="color: ${opened >= 1 ? '#00ff88' : '#00d4ff'};"></i>
          <div class="box-label">${opened >= 1 ? 'Completed' : 'Tap'}</div>
          <div class="box-reward"><div class="reward-amount">+₦${earning.toLocaleString()}</div></div>
        `;
        if (opened < 1 && taskStatus.can_open) {
          box.onclick = () => openBox(box, earning);
        }
        grid.appendChild(box);
      } else {
        // M1+ Grid
        grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
        for (let i = 0; i < max; i++) {
          const isOpened = i < opened;
          const box = document.createElement('div');
          box.className = `mystery-box ${isOpened ? 'opened' : ''}`;
          box.innerHTML = `
            <i class="fa-solid ${isOpened ? 'fa-check-circle' : 'fa-gift'} box-icon" style="color: ${isOpened ? '#00ff88' : '#00d4ff'};"></i>
            <div class="box-label">${isOpened ? 'Opened' : 'Tap'}</div>
            <div class="box-reward"><div class="reward-amount">+₦${earning.toLocaleString()}</div></div>
          `;
          if (!isOpened && taskStatus.can_open) {
            box.onclick = () => openBox(box, earning);
          }
          grid.appendChild(box);
        }
      }
    }

    function createSparkles(element) {
      const rect = element.getBoundingClientRect();
      const centerX = rect.left + (rect.width / 2);
      const centerY = rect.top + (rect.height / 2);
      
      const colors = ['#00d4ff', '#00ff88', '#ffd700', '#ffffff'];
      
      for (let i = 0; i < 100; i++) {
        const sparkle = document.createElement('div');
        const angle = (Math.PI * 2 * i) / 100;
        const distance = 100 + Math.random() * 150;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        const size = 4 + Math.random() * 8;
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        sparkle.className = 'sparkle';
        sparkle.style.cssText = `
          position: fixed !important;
          left: ${centerX}px !important;
          top: ${centerY}px !important;
          width: ${size}px !important;
          height: ${size}px !important;
          background: ${color} !important;
          color: ${color} !important;
          border-radius: 50% !important;
          pointer-events: none !important;
          z-index: 999999 !important;
          --tx: ${tx}px;
          --ty: ${ty}px;
          animation: sparkleBurst 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
        `;
        
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 3000);
      }
    }

    function showNotification(amount) {
      const notif = document.getElementById('notification');
      const notifText = document.getElementById('notification-text');
      notifText.textContent = `You earned ₦${amount.toLocaleString()}!`;
      notif.classList.add('show');
      setTimeout(() => notif.classList.remove('show'), 3000);
    }

    async function openBox(boxElement, amount) {
      if (boxElement.classList.contains('opened') || boxElement.classList.contains('opening')) return;
      
      boxElement.classList.add('opening');
      createSparkles(boxElement);
      
      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/task?action=openMysteryBox', {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({})
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to open box');

        setTimeout(() => {
          boxElement.classList.remove('opening');
          boxElement.classList.add('opened');
          
          // Update the reward text with the real random amount
          const rewardAmountDiv = boxElement.querySelector('.reward-amount');
          if (rewardAmountDiv) {
            rewardAmountDiv.textContent = `+₦${Number(data.amount).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          }

          // Update UI locally for smooth experience
          taskStatus.boxes_opened = data.boxes_opened;
          taskStatus.can_open = data.boxes_opened < data.max_boxes;
          updateProgress(data.boxes_opened, data.max_boxes);
          
          // Update icon and label
          const icon = boxElement.querySelector('.box-icon');
          const label = boxElement.querySelector('.box-label');
          if (icon) { icon.className = 'fa-solid fa-check-circle box-icon'; icon.style.color = '#00ff88'; }
          if (label) label.textContent = 'Opened';
          
          showNotification(data.amount);
        }, 600);
        
      } catch (err) {
        console.error('Open box error:', err);
        boxElement.classList.remove('opening');
        showToast(err.message, 'error');
      }
    }
    
    loadTasks();
  </script>
</body>
</html>
