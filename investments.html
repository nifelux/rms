<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Daily Tasks</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .task-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--rms-yellow), var(--rms-vivid-red)); transition: width 0.5s ease; }
    
    .box-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    
    .mystery-box {
      aspect-ratio: 1;
      background: var(--rms-bg-card);
      border: 2px solid var(--rms-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: visible;
    }
    
    .mystery-box:hover {
      transform: scale(1.05);
      border-color: var(--rms-yellow);
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
    }
    
    .mystery-box.opened {
      border-color: var(--rms-text-muted);
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
    }
    
    .mystery-box.opening {
      animation: boxShake 0.5s ease;
    }
    
    .box-icon {
      font-size: 2.5rem;
      color: var(--rms-yellow);
      margin-bottom: 8px;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }
    
    .mystery-box:hover .box-icon {
      transform: rotate(-10deg) scale(1.1);
    }
    
    .mystery-box.opening .box-icon {
      animation: boxLidFly 0.6s ease forwards;
    }
    
    .box-label {
      font-size: 0.8rem;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }
    
    .box-reward {
      position: absolute;
      inset: 0;
      background: rgba(10,14,39,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--rms-yellow);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 3;
    }
    
    .mystery-box.opened .box-reward {
      opacity: 1;
    }
    
    .mystery-box.opened .box-icon {
      display: none;
    }
    
    .mystery-box.opened .box-label {
      display: none;
    }
    
    /* Shine/Sparkle Effects */
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--rms-yellow);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 10px var(--rms-yellow), 0 0 20px var(--rms-yellow);
    }
    
    @keyframes sparkleBurst {
      0% {
        transform: translate(0, 0) scale(0);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1);
        opacity: 0;
      }
    }
    
    @keyframes boxShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    
    @keyframes boxLidFly {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-50px) rotate(-30deg);
        opacity: 0;
      }
    }
    
    @keyframes rewardReveal {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.3) rotate(10deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }
    
    .reward-amount {
      animation: rewardReveal 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
      text-shadow: 0 0 20px var(--rms-yellow), 0 0 40px var(--rms-yellow);
    }
    
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
      50% { box-shadow: 0 0 40px rgba(255,215,0,0.8), 0 0 60px rgba(255,215,0,0.6); }
    }
    
    .mystery-box.opening {
      animation: glowPulse 0.5s ease;
    }

    .tier-badge { display: inline-block; background: rgba(255,26,26,0.1); color: var(--rms-vivid-red); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; }
    .tier-badge.weekend { background: rgba(52,152,219,0.15); color: #3498db; }
    
    .error-box { text-align: center; padding: 40px 20px; grid-column: 1 / -1; }
    .error-box i { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    .loading-box { text-align: center; padding: 40px; color: var(--rms-text-muted); }
    
    .weekend-info {
      background: rgba(52,152,219,0.1);
      border: 1px solid #3498db;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }
    .weekend-info i { font-size: 2.5rem; color: #3498db; margin-bottom: 12px; }
    .weekend-info h3 { color: #3498db; margin: 0 0 8px 0; font-size: 1.2rem; }
    .weekend-info p { color: var(--rms-text-muted); margin: 0; font-size: 0.9rem; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="task-container">
    <h2 style="margin-bottom: 5px;">Daily Mystery Boxes</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Tap a box to reveal your reward.</p>

    <div class="tier-badge" id="current-tier">Loading Tier...</div>

    <div class="progress-header">
      <span class="text-muted" style="font-size: 0.85rem;">Daily Progress</span>
      <span class="text-yellow" style="font-weight: 700; font-size: 0.85rem;" id="progress-text">0 / 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
    </div>

    <div class="box-grid" id="box-grid">
      <div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading...</p></div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    let taskStatus = null;

    async function loadTasks() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      const grid = document.getElementById('box-grid');
      grid.innerHTML = '<div class="loading-box"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading...</p></div>';

      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/task?action=getTaskStatus', { 
          headers: { 'Authorization': `Bearer ${token}` } 
        });
        
        if (!res.ok) {
          const errorData = await res.json();
          throw new Error(errorData.error || 'Failed to load tasks');
        }
        
        taskStatus = await res.json();

        if (taskStatus.weekend_closed) {
          document.getElementById('current-tier').textContent = 'Weekend Break';
          document.getElementById('current-tier').className = 'tier-badge weekend';
          document.getElementById('progress-text').textContent = '0 / 0';
          document.getElementById('progress-fill').style.width = '0%';
          
          grid.innerHTML = `
            <div class="error-box" style="grid-column: 1/-1;">
              <div class="weekend-info">
                <i class="fa-solid fa-calendar-xmark"></i>
                <h3>Weekend Break</h3>
                <p>${taskStatus.message || 'Tasks are closed on Saturdays and Sundays'}</p>
                <p style="margin-top: 12px; font-size: 0.85rem;"><i class="fa-solid fa-clock" style="margin-right: 6px;"></i>Come back on Monday to claim your boxes!</p>
              </div>
            </div>
          `;
          return;
        }

        if (!taskStatus.tier || taskStatus.tier === 'newbie') {
          document.getElementById('current-tier').textContent = 'No Tier - Upgrade Required';
          document.getElementById('current-tier').style.background = 'rgba(255,26,26,0.2)';
          document.getElementById('progress-text').textContent = '0 / 0';
          grid.innerHTML = `
            <div class="error-box" style="grid-column: 1/-1;">
              <i class="fa-solid fa-lock" style="color: var(--rms-text-muted);"></i>
              <p style="color: var(--rms-text-muted); margin: 16px 0;">Upgrade to M0 or higher to unlock Mystery Boxes</p>
              <a href="/vip.html" class="rms-btn rms-btn-primary" style="text-decoration:none; display: inline-block;">View VIP Tiers</a>
            </div>
          `;
          return;
        }

        if (taskStatus.m0_expired) {
          document.getElementById('current-tier').textContent = 'M0 Expired';
          document.getElementById('current-tier').style.background = 'rgba(255,26,26,0.2)';
          grid.innerHTML = `
            <div class="error-box" style="grid-column: 1/-1;">
              <i class="fa-solid fa-clock" style="color: var(--rms-text-muted);"></i>
              <p style="color: var(--rms-text-muted); margin: 16px 0;">${taskStatus.message || 'Your free trial has expired'}</p>
              <a href="/vip.html" class="rms-btn rms-btn-primary" style="text-decoration:none; display: inline-block;">Upgrade Now</a>
            </div>
          `;
          return;
        }

        document.getElementById('current-tier').textContent = `Tier: ${taskStatus.tier.toUpperCase()}`;
        document.getElementById('current-tier').style.background = 'rgba(255,215,0,0.15)';
        document.getElementById('progress-text').textContent = `${taskStatus.boxes_opened} / ${taskStatus.max_boxes}`;
        document.getElementById('progress-fill').style.width = `${taskStatus.max_boxes > 0 ? (taskStatus.boxes_opened / taskStatus.max_boxes) * 100 : 0}%`;

        renderBoxes();
      } catch (err) {
        console.error('Task loading error:', err);
        document.getElementById('current-tier').textContent = 'Error';
        document.getElementById('current-tier').style.background = 'rgba(255,26,26,0.2)';
        grid.innerHTML = `
          <div class="error-box" style="grid-column: 1/-1;">
            <i class="fa-solid fa-triangle-exclamation" style="color: var(--rms-vivid-red);"></i>
            <p style="color: var(--rms-vivid-red);">${err.message}</p>
            <button onclick="loadTasks()" class="rms-btn rms-btn-outline" style="margin-top: 10px;">Retry</button>
          </div>
        `;
      }
    }

    function renderBoxes() {
      const grid = document.getElementById('box-grid');
      grid.innerHTML = '';
      const max = taskStatus.max_boxes || 0;
      
      if (max === 0) {
        grid.innerHTML = '<div class="error-box" style="grid-column: 1/-1;"><p>No boxes available for this tier.</p></div>';
        return;
      }

      for (let i = 0; i < max; i++) {
        const isOpened = i < taskStatus.boxes_opened;
        const box = document.createElement('div');
        box.className = `mystery-box ${isOpened ? 'opened' : ''}`;
        box.innerHTML = `
          <i class="fa-solid fa-gift box-icon"></i>
          <div class="box-label">${isOpened ? 'Opened' : 'Tap to Open'}</div>
          <div class="box-reward">
            <div class="reward-amount">+₦${taskStatus.earning_per_box.toLocaleString()}</div>
          </div>
        `;
        if (!isOpened && taskStatus.can_open) {
          box.onclick = () => openBox(box);
        }
        grid.appendChild(box);
      }
    }

    function createSparkles(boxElement) {
      // Get box center position relative to document
      const rect = boxElement.getBoundingClientRect();
      const scrollX = window.scrollX || window.pageXOffset;
      const scrollY = window.scrollY || window.pageYOffset;
      const centerX = rect.left + scrollX + (rect.width / 2);
      const centerY = rect.top + scrollY + (rect.height / 2);
      
      // Create 30 sparkles
      for (let i = 0; i < 30; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        
        const angle = (Math.PI * 2 * i) / 30;
        const distance = 80 + Math.random() * 70;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        // Random size
        const size = 6 + Math.random() * 8;
        
        sparkle.style.cssText = `
          position: fixed !important;
          left: ${centerX}px !important;
          top: ${centerY}px !important;
          width: ${size}px !important;
          height: ${size}px !important;
          background: #ffd700 !important;
          border-radius: 50% !important;
          box-shadow: 0 0 15px #ffd700, 0 0 30px #ffd700, 0 0 45px #ffed4e !important;
          pointer-events: none !important;
          z-index: 999999 !important;
          --tx: ${tx}px;
          --ty: ${ty}px;
          animation: sparkleBurst 0.8s ease-out forwards !important;
        `;
        
        document.body.appendChild(sparkle);
        setTimeout(() => {
          if (sparkle.parentNode) sparkle.parentNode.removeChild(sparkle);
        }, 1000);
      }
                                  }

    async function openBox(boxElement) {
      if (boxElement.classList.contains('opened') || boxElement.classList.contains('opening')) return;
      
      boxElement.classList.add('opening');
      createSparkles(boxElement);
      
      try {
        const token = (await supabase.auth.getSession()).data.session.access_token;
        const res = await fetch('/api/task?action=openMysteryBox', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({})
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to open box');

        setTimeout(() => {
          boxElement.classList.remove('opening');
          boxElement.classList.add('opened');
          
          taskStatus.boxes_opened++;
          document.getElementById('progress-text').textContent = `${taskStatus.boxes_opened} / ${taskStatus.max_boxes}`;
          document.getElementById('progress-fill').style.width = `${(taskStatus.boxes_opened / taskStatus.max_boxes) * 100}%`;
          
          if (taskStatus.boxes_opened >= taskStatus.max_boxes) {
            taskStatus.can_open = false;
            document.querySelectorAll('.mystery-box:not(.opened)').forEach(b => b.style.pointerEvents = 'none');
          }
          
          showToast(`🎉 You earned ₦${data.amount.toLocaleString()}!`, 'success');
        }, 600);
        
      } catch (err) {
        boxElement.classList.remove('opening');
        showToast(err.message, 'error');
      }
    }

    loadTasks();
  </script>
</body>
</html>
