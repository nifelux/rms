<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Plan Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .details-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .plan-hero { 
      background: linear-gradient(135deg, var(--rms-bg-card), #1a2050); 
      border: 1px solid var(--rms-yellow); border-radius: 16px; 
      padding: 30px 20px; text-align: center; margin-bottom: 24px; position: relative;
    }
    .plan-name { font-size: 1.8rem; font-weight: 800; color: var(--rms-white); margin-bottom: 8px; }
    .plan-desc { font-size: 0.9rem; color: var(--rms-text-muted); margin-bottom: 20px; }
    .roi-badge { 
      display: inline-block; background: rgba(46,204,113,0.15); color: #2ecc71; 
      padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem;
    }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .detail-box { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 12px; padding: 16px; text-align: center; }
    .detail-lbl { font-size: 0.75rem; color: var(--rms-text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .detail-val { font-size: 1.3rem; font-weight: 800; color: var(--rms-white); }
    .detail-val.highlight { color: var(--rms-yellow); }

    .info-box { background: rgba(255,215,0,0.05); border: 1px solid var(--rms-yellow); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .info-box h4 { margin: 0 0 8px 0; color: var(--rms-yellow); font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
    .info-box p { margin: 0; font-size: 0.85rem; color: var(--rms-text-muted); line-height: 1.5; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="details-container">
    <div id="plan-content">
      <p class="text-muted" style="text-align:center; padding: 40px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading plan details...</p>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadPlanDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const planId = urlParams.get('id');
      
      if (!planId) {
        document.getElementById('plan-content').innerHTML = '<p class="text-muted" style="text-align:center;">Invalid plan selected.</p>';
        return;
      }

      const { data: plan } = await supabase.from('wealth_plans').select('*').eq('id', planId).single();
      
      if (!plan) {
        document.getElementById('plan-content').innerHTML = '<p class="text-muted" style="text-align:center;">Plan not found.</p>';
        return;
      }

      const profit = Number(plan.return_amount) - Number(plan.invest_amount);
      const roi = ((profit / Number(plan.invest_amount)) * 100).toFixed(1);

      document.getElementById('plan-content').innerHTML = `
        <div class="plan-hero">
          <div class="plan-name">${plan.name}</div>
          <div class="plan-desc">${plan.description || 'Secure your future with guaranteed returns.'}</div>
          <div class="roi-badge"><i class="fa-solid fa-chart-line"></i> ${roi}% Total ROI</div>
        </div>

        <div class="detail-grid">
          <div class="detail-box">
            <div class="detail-lbl">Invest Amount</div>
            <div class="detail-val">₦${Number(plan.invest_amount).toLocaleString()}</div>
          </div>
          <div class="detail-box">
            <div class="detail-lbl">Total Return</div>
            <div class="detail-val highlight">₦${Number(plan.return_amount).toLocaleString()}</div>
          </div>
          <div class="detail-box">
            <div class="detail-lbl">Duration</div>
            <div class="detail-val">${plan.duration_days} Days</div>
          </div>
          <div class="detail-box">
            <div class="detail-lbl">Net Profit</div>
            <div class="detail-val" style="color:#2ecc71;">₦${profit.toLocaleString()}</div>
          </div>
        </div>

        <div class="info-box">
          <h4><i class="fa-solid fa-circle-info"></i> How it works</h4>
          <p>1. Click "Invest Now" to lock your funds.<br>
             2. Wait for ${plan.duration_days} days for the plan to mature.<br>
             3. Go to the Wealth Center and claim your full return (Principal + Profit) directly to your wallet.</p>
        </div>

        <a href="/wealth-center.html" class="rms-btn rms-btn-outline" style="width: 100%; text-align: center; padding: 14px;">
          <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Back to Wealth Center
        </a>
      `;
    }
    loadPlanDetails();
  </script>
</body>
</html>
