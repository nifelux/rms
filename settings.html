<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Settings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .settings-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .settings-group { margin-bottom: 24px; }
    .settings-group-title { font-size: 0.8rem; color: var(--rms-text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding-left: 4px; }
    .menu-list { background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 16px; overflow: hidden; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); text-decoration: none; color: white; cursor: pointer; }
    .menu-item:last-child { border-bottom: none; }
    .menu-item-left { display: flex; align-items: center; gap: 14px; font-size: 0.95rem; }
    .menu-item-left i { width: 20px; text-align: center; color: var(--rms-yellow); }
    
    /* Toggle Switch */
    .toggle { position: relative; width: 44px; height: 24px; background: rgba(255,255,255,0.1); border-radius: 24px; cursor: pointer; transition: 0.3s; }
    .toggle.active { background: var(--rms-yellow); }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle.active::after { left: 22px; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="settings-container">
    <h2 style="margin-bottom: 24px;">Settings</h2>

    <div class="settings-group">
      <div class="settings-group-title">Account</div>
      <div class="menu-list">
        <div class="menu-item" onclick="alert('Password change modal would open here.')">
          <div class="menu-item-left"><i class="fa-solid fa-key"></i> Change Password</div>
          <i class="fa-solid fa-chevron-right" style="color:var(--rms-text-muted); font-size:0.8rem;"></i>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">Notifications</div>
      <div class="menu-list">
        <div class="menu-item">
          <div class="menu-item-left"><i class="fa-solid fa-bell"></i> Push Notifications</div>
          <div class="toggle active" onclick="this.classList.toggle('active')"></div>
        </div>
        <div class="menu-item">
          <div class="menu-item-left"><i class="fa-solid fa-envelope"></i> Email Alerts</div>
          <div class="toggle active" onclick="this.classList.toggle('active')"></div>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-title">App</div>
      <div class="menu-list">
        <div class="menu-item">
          <div class="menu-item-left"><i class="fa-solid fa-globe"></i> Language</div>
          <div style="color:var(--rms-text-muted); font-size:0.9rem;">English <i class="fa-solid fa-chevron-right" style="margin-left:8px; font-size:0.7rem;"></i></div>
        </div>
        <div class="menu-item">
          <div class="menu-item-left"><i class="fa-solid fa-circle-info"></i> About RMS</div>
          <i class="fa-solid fa-chevron-right" style="color:var(--rms-text-muted); font-size:0.8rem;"></i>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">

    window.supabase = supabase;
  </script>
</body>
</html>
