<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    /* Reuse auth styles from login.html */
    .auth-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: var(--rms-bg); }
    .auth-card { width: 100%; max-width: 400px; background: var(--rms-bg-card); border: 1px solid var(--rms-border); border-radius: 20px; padding: 30px 24px; box-shadow: var(--rms-shadow); }
    .logo-center { text-align: center; font-size: 2.5rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--rms-text-muted); margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--rms-text-muted); }
    .form-control { width: 100%; padding: 14px 14px 14px 42px; background: rgba(0,0,0,0.3); border: 1px solid var(--rms-border); border-radius: 12px; color: white; font-size: 1rem; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--rms-yellow); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--rms-text-muted); }
    .auth-footer a { color: var(--rms-yellow); text-decoration: none; font-weight: 600; }
    .referral-badge { background: rgba(255,215,0,0.1); color: var(--rms-yellow); padding: 8px; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-center">RMS<span class="text-red"><i class="fa-solid fa-bolt"></i></span></div>
      <h3 style="text-align:center; margin-bottom: 10px;">Create Account</h3>
      
      <div id="referral-display" class="referral-badge">
        <i class="fa-solid fa-user-plus"></i> Referred by: <span id="ref-code"></span>
      </div>

      <form id="register-form">
        <div class="input-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="full_name" class="form-control" placeholder="John Doe" required>
          </div>
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>
        </div>
        <button type="submit" class="rms-btn rms-btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
          <i class="fa-solid fa-user-plus" style="margin-right: 8px;"></i> Sign Up
        </button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="/login.html">Login</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');

    // Check for referral code in URL
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
      document.getElementById('ref-code').textContent = refCode;
      document.getElementById('referral-display').style.display = 'block';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';
      btn.disabled = true;

      const { data, error } = await supabase.auth.signUp({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        options: { data: { full_name: document.getElementById('full_name').value } }
      });

      if (error) {
        alert(error.message);
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';
        btn.disabled = false;
      } else {
        // Link referral if exists
        if (refCode && data.user) {
          const { data: referrer } = await supabase.from('profiles').select('id').eq('referral_code', refCode).single();
          if (referrer) {
            await supabase.from('profiles').update({ referred_by: referrer.id }).eq('id', data.user.id);
          }
        }
        alert('Account created! Please check your email to verify.');
        window.location.href = '/login.html';
      }
    });
  </script>
</body>
</html>
