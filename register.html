<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Create Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0a0e27">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Premium Header */
    .auth-header-bar {
      background: linear-gradient(135deg, rgba(10,14,39,0.95), rgba(26,31,78,0.95));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,215,0,0.2);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ffd700, #e6c200);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0a0e27;
      box-shadow: 0 4px 12px rgba(255,215,0,0.3);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
      letter-spacing: 1px;
    }

    .brand-name span {
      color: #ff1a1a;
      font-size: 1.1rem;
    }

    .brand-tag {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-badge {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #ffd700;
      font-weight: 600;
    }

    /* Main Container */
    .auth-container {
      padding: 24px 20px 40px 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .auth-card {
      background: linear-gradient(135deg, rgba(17,22,58,0.8), rgba(26,32,80,0.8));
      border: 1px solid rgba(255,215,0,0.15);
      border-radius: 20px;
      padding: 28px 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-title h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
    }

    .auth-title p {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }

    /* Referral Banner */
    .referral-banner {
      background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,26,26,0.1));
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 20px 0;
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .referral-banner i {
      font-size: 1.4rem;
      color: #ffd700;
    }

    .referral-banner-text {
      flex: 1;
    }

    .referral-banner-text strong {
      color: #ffd700;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .referral-banner-text span {
      display: block;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
      margin-top: 2px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: #ffd700;
      background: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
    }

    .form-control.error {
      border-color: #ff1a1a;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #ffd700;
    }

    /* Password Strength */
    .password-strength {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
      border-radius: 2px;
    }

    .strength-weak { width: 33%; background: #ff1a1a; }
    .strength-medium { width: 66%; background: #ffd700; }
    .strength-strong { width: 100%; background: #2ecc71; }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #e6c200);
      color: #0a0e27;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(255,215,0,0.3);
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255,215,0,0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }

    .auth-footer a {
      color: #ffd700;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      color: #e6c200;
      text-decoration: underline;
    }

    .terms-text {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-top: 20px;
      line-height: 1.5;
    }

    .terms-text a {
      color: #ffd700;
      text-decoration: none;
    }

    .terms-text a:hover {
      text-decoration: underline;
    }

    /* Decorative Elements */
    .auth-container::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Premium Header -->
  <header class="auth-header-bar">
    <a href="/" class="brand">
      <div class="brand-mark">R</div>
      <div class="brand-copy">
        <div class="brand-name">RMS<span><i class="fa-solid fa-bolt"></i></span></div>
        <div class="brand-tag">Royal Management System</div>
      </div>
    </a>
    <div class="header-badge">
      <i class="fa-solid fa-shield-halved"></i> Secure
    </div>
  </header>

  <!-- Main Content -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-title">
        <h2>Create Your Account</h2>
        <p>Join thousands earning with RMS today</p>
      </div>

      <!-- Referral Banner -->
      <div class="referral-banner" id="referral-banner">
        <i class="fa-solid fa-user-plus"></i>
        <div class="referral-banner-text">
          <strong id="ref-code-display">---</strong>
          <span>You were referred by a friend</span>
        </div>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="full-name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Create a strong password" required minlength="6">
            <button type="button" class="toggle-password" onclick="togglePass('password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="password-strength">
            <div class="password-strength-bar" id="strength-bar"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" required>
            <button type="button" class="toggle-password" onclick="togglePass('confirm-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>

      <div class="terms-text">
        By creating an account, you agree to our <a href="/terms.html">Terms of Service</a> and <a href="/privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    // 1. Capture referral code from URL
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');

    // Show referral banner if code exists
    if (refCode) {
      const banner = document.getElementById('referral-banner');
      const display = document.getElementById('ref-code-display');
      banner.style.display = 'flex';
      display.textContent = refCode;
    }

    // 2. Password visibility toggle
    window.togglePass = (id, btn) => {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    };

    // 3. Password strength indicator
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strength-bar');

    passwordInput.addEventListener('input', (e) => {
      const val = e.target.value;
      strengthBar.className = 'password-strength-bar';
      
      if (val.length === 0) return;
      if (val.length < 6) {
        strengthBar.classList.add('strength-weak');
      } else if (val.length < 10 || !/[A-Z]/.test(val) || !/[0-9]/.test(val)) {
        strengthBar.classList.add('strength-medium');
      } else {
        strengthBar.classList.add('strength-strong');
      }
    });

    // 4. Form submission
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('full-name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('submit-btn');

      // Validation
      if (!fullName) {
        showToast('Please enter your full name', 'error');
        return;
      }

      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email address', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Passwords do not match!', 'error');
        document.getElementById('confirm-password').classList.add('error');
        setTimeout(() => {
          document.getElementById('confirm-password').classList.remove('error');
        }, 2000);
        return;
      }

      // Disable button and show loading
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating account...';

      try {
        // 5. Create the user account
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { 
              full_name: fullName,
              referred_by_code: refCode || null
            }
          }
        });

        if (error) throw error;

        if (data.user) {
          showToast('Account created successfully! Please verify your email.', 'success');

          // Redirect to login after 3 seconds
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        }

      } catch (err) {
        console.error('Registration error:', err);
        
        let message = err.message || 'Registration failed';
        if (message.includes('already registered')) {
          message = 'This email is already registered. Please sign in.';
        } else if (message.includes('password')) {
          message = 'Password is too weak. Use at least 6 characters.';
        }
        
        showToast(message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    });
  </script>
</body>
</html>
