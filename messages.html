<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMS — Messages</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .messages-container { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    .msg-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s; }
    .msg-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(0,212,255,0.3); }
    .msg-card.unread { border-left: 4px solid #00d4ff; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .msg-title { font-weight: 700; font-size: 1rem; color: white; }
    .msg-date { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    .msg-preview { font-size: 0.9rem; color: rgba(255,255,255,0.7); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .msg-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); line-height: 1.6; }
    .msg-detail.show { display: block; }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>
  <div class="messages-container">
    <h2 style="margin-bottom: 20px; color: white;"><i class="fa-solid fa-envelope" style="color: #00d4ff;"></i> Messages</h2>
    <div id="messages-list">
      <div style="text-align:center; padding:40px; color:rgba(255,255,255,0.5);"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading...</p></div>
    </div>
  </div>
  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');

    async function loadMessages() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      const { data: messages } = await supabase.from('messages').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      const list = document.getElementById('messages-list');

      if (!messages || messages.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:40px; color:rgba(255,255,255,0.5);"><i class="fa-solid fa-inbox" style="font-size:2rem; margin-bottom:12px;"></i><p>No messages yet.</p></div>';
        return;
      }

      list.innerHTML = messages.map(m => `
        <div class="msg-card ${m.is_read ? '' : 'unread'}" onclick="toggleMsg(this, '${m.id}')">
          <div class="msg-header">
            <div class="msg-title">${m.title}</div>
            <div class="msg-date">${new Date(m.created_at).toLocaleDateString()}</div>
          </div>
          <div class="msg-preview">${m.body}</div>
          <div class="msg-detail">${m.body}</div>
        </div>
      `).join('');
    }

    window.toggleMsg = async (el, id) => {
      const detail = el.querySelector('.msg-detail');
      detail.classList.toggle('show');
      if (!el.classList.contains('unread')) return;
      
      el.classList.remove('unread');
      await supabase.from('messages').update({ is_read: true }).eq('id', id);
    };

    loadMessages();
  </script>
</body>
</html>
