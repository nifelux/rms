<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RMS — Messages</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="theme-color" content="#0a0e27">
  <style>
    .messages-container { padding: 20px 16px 100px 16px; max-width: 600px; margin: 0 auto; }
    .msg-card { 
      background: var(--rms-bg-card); border: 1px solid var(--rms-border); 
      border-radius: 12px; padding: 16px; margin-bottom: 12px; 
      display: flex; gap: 14px; transition: background 0.2s;
    }
    .msg-card.unread { border-left: 3px solid var(--rms-yellow); background: rgba(255,215,0,0.03); }
    .msg-icon { 
      width: 40px; height: 40px; background: rgba(255,255,255,0.05); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: var(--rms-yellow); flex-shrink: 0;
    }
    .msg-content { flex: 1; }
    .msg-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; color: var(--rms-white); }
    .msg-body { font-size: 0.85rem; color: var(--rms-text-muted); line-height: 1.4; margin-bottom: 6px; }
    .msg-date { font-size: 0.7rem; color: var(--rms-text-muted); }
    .empty-msgs { text-align: center; padding: 40px 20px; color: var(--rms-text-muted); }
  </style>
</head>
<body class="rv-shell">
  <div id="header-container"></div>

  <div class="messages-container">
    <h2 style="margin-bottom: 20px;">Messages</h2>
    <div id="messages-list">
      <div class="empty-msgs"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:1.5rem;"></i><p style="margin-top:10px;">Loading messages...</p></div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="/assets/js/components.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://ofysznsajwxnjqaumwch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXN6bnNhand4bmpxYXVtd2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzM4NDgsImV4cCI6MjEwMzgwOTg0OH0.XaHkP5WZ2nJVJXVdbG-D13rrD63g_09HxmJoZn7ZoWA');
    window.supabase = supabase;

    async function loadMessages() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return window.location.href = '/login.html';

      const { data: messages } = await supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      const list = document.getElementById('messages-list');

      if (!messages || messages.length === 0) {
        list.innerHTML = '<div class="empty-msgs"><i class="fa-regular fa-envelope-open" style="font-size:2rem; margin-bottom:10px;"></i><p>No messages yet.</p></div>';
        return;
      }

      list.innerHTML = messages.map(m => {
        const date = new Date(m.created_at).toLocaleDateString('en-NG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `
          <div class="msg-card ${!m.is_read ? 'unread' : ''}">
            <div class="msg-icon"><i class="fa-solid fa-bell"></i></div>
            <div class="msg-content">
              <div class="msg-title">${m.title || 'Notification'}</div>
              <div class="msg-body">${m.body || ''}</div>
              <div class="msg-date">${date}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    loadMessages();
  </script>
</body>
</html>
